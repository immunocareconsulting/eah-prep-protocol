const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function rr(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
const FONT = "'Bangers', 'Impact', 'Arial Black', sans-serif";

// Big outlined cartoon text
function bigText(c, text, x, y, size, fill = '#fff', stroke = '#0b1530', align = 'center', f = FONT) {
  c.save();
  c.font = font(size, f);
  c.textAlign = align; c.textBaseline = 'middle';
  c.lineJoin = 'round';
  c.lineWidth = Math.max(3, size / 7);
  c.strokeStyle = stroke;
  c.strokeText(text, x, y);
  c.fillStyle = fill;
  c.fillText(text, x, y);
  c.restore();
}

// Input: keyboard (two layouts), gamepads, touch
// ------------------------------------------------------------
const BTN = ['left', 'right', 'up', 'down', 'lp', 'hp', 'lk', 'hk', 'sp', 'ult'];
const KEYMAP_P1 = {
  left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],
  lp: ['KeyJ'], hp: ['KeyK'], lk: ['KeyU'], hk: ['KeyI'], sp: ['KeyL'], ult: ['KeyO']
};
const KEYMAP_P2 = {
  left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
  lp: ['Numpad1', 'Comma'], hp: ['Numpad2', 'Period'], lk: ['Numpad4', 'Semicolon'], hk: ['Numpad5', 'Quote'],
  sp: ['Numpad3', 'Slash'], ult: ['Numpad6', 'BracketRight']
};
const Input = {
  keys: new Set(), pressedKeys: new Set(), touch: {}, touchPressed: {},
  pads: [], padPrev: [[], []], anyPressed: false, mouse: null,
  init() {
    addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Slash', 'Quote'].includes(e.code)) e.preventDefault();
      if (!this.keys.has(e.code)) this.pressedKeys.add(e.code);
      this.keys.add(e.code);
      AudioSys.unlock();
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
  },
  down(code) { return this.keys.has(code); },
  pressed(code) { return this.pressedKeys.has(code); },
  // menu-level helpers
  menu(action) {
    const k = this.pressedKeys;
    const pad = this.padMenu;
    switch (action) {
      case 'up': return k.has('KeyW') || k.has('ArrowUp') || pad.up;
      case 'down': return k.has('KeyS') || k.has('ArrowDown') || pad.down;
      case 'left': return k.has('KeyA') || k.has('ArrowLeft') || pad.left;
      case 'right': return k.has('KeyD') || k.has('ArrowRight') || pad.right;
      case 'ok': return k.has('Enter') || k.has('Space') || k.has('KeyJ') || k.has('NumpadEnter') || pad.ok;
      case 'back': return k.has('Escape') || k.has('Backspace') || pad.back;
      case 'pause': return k.has('Escape') || k.has('KeyP') || pad.start;
    }
    return false;
  },
  padMenu: {},
  pollPads() {
    const gp = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
    this.pads = gp;
    this.padMenu = {};
    gp.slice(0, 2).forEach((p, i) => {
      const prev = this.padPrev[i] || [];
      const cur = p.buttons.map(b => b.pressed);
      const ax = p.axes || [];
      cur[100] = (ax[0] || 0) < -0.5; cur[101] = (ax[0] || 0) > 0.5; cur[102] = (ax[1] || 0) < -0.5; cur[103] = (ax[1] || 0) > 0.5;
      const pr = idx => cur[idx] && !prev[idx];
      if (pr(12) || pr(102)) this.padMenu.up = true;
      if (pr(13) || pr(103)) this.padMenu.down = true;
      if (pr(14) || pr(100)) this.padMenu.left = true;
      if (pr(15) || pr(101)) this.padMenu.right = true;
      if (pr(0)) this.padMenu.ok = true;
      if (pr(1)) this.padMenu.back = true;
      if (pr(9)) this.padMenu.start = true;
      this.padPrev[i] = cur;
      p._cur = cur; p._prev = prev;
    });
  },
  // Build a per-player control frame. layouts: array of keymaps; padIndex; useTouch
  read(layouts, padIndex, useTouch) {
    const held = {}, pressed = {};
    for (const b of BTN) {
      held[b] = false; pressed[b] = false;
      for (const map of layouts) for (const code of map[b]) {
        if (this.keys.has(code)) held[b] = true;
        if (this.pressedKeys.has(code)) pressed[b] = true;
      }
      if (useTouch) {
        if (this.touch[b]) held[b] = true;
        if (this.touchPressed[b]) pressed[b] = true;
      }
    }
    const p = this.pads[padIndex];
    if (p && p._cur) {
      const c = p._cur, pv = p._prev;
      const map = { left: [14, 100], right: [15, 101], up: [12, 102, 3 /*Y*/ ], down: [13, 103, 6], lp: [2], hp: [3], lk: [0], hk: [1], sp: [5, 4], ult: [7] };
      // Y used for HP; jump on up/stick only
      map.up = [12, 102];
      for (const b of BTN) for (const i of map[b]) {
        if (c[i]) held[b] = true;
        if (c[i] && !pv[i]) pressed[b] = true;
      }
    }
    return { held, pressed };
  },
  endFrame() { this.pressedKeys.clear(); this.touchPressed = {}; this.mouse = null; }
};
Input.init();

const AudioSys = {
  ac: null, master: null, musicGain: null, sfxGain: null, noiseBuf: null,
  musicOn: false, track: null, step: 0, nextTime: 0, timer: null,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();

      const ln = tr.lead[s % tr.lead.length];

        this.tone(mf(tr.root + ln + shift), spb * 1.6, 'square', 0.07, null, d, this.musicGain);
      }
      this.nextTime += spb; this.step++;

// Announcer: on-screen callout + optional browser speech

const Announcer = {
  queue: [], current: null,
  say(text, opts = {}) {
    const a = { text, t: 0, dur: opts.dur || 90, color: opts.color || '#ffd23f', size: opts.size || 96, y: opts.y || H * 0.42, sub: opts.sub || null };
    if (opts.queue) this.queue.push(a); else { this.current = a; this.queue = []; }
    if (Settings.voice && opts.voice !== false) this.speak(opts.speak || text);
  },
  speak(text) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[—!]/g, m => m === '—' ? ',' : '!'));
      u.rate = 1.05; u.pitch = 0.55; u.volume = Math.min(1, Settings.sfx + 0.2);
      const v = speechSynthesis.getVoices().find(v => /en/i.test(v.lang) && /male|david|daniel|alex|fred|google uk english male/i.test(v.name));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* speech unavailable */ }
  },
  update() {
    if (this.current) { this.current.t++; if (this.current.t > this.current.dur) this.current = this.queue.shift() || null; }
    else if (this.queue.length) this.current = this.queue.shift();
  },
  draw(c) {
    const a = this.current; if (!a) return;
    const p = a.t / a.dur;
    const sIn = Math.min(1, a.t / 10);
    const scale = a.t < 10 ? easeOutBack(sIn) * 1.0 : 1 + Math.max(0, p - 0.85) * 0.6;
    const alpha = p > 0.85 ? 1 - (p - 0.85) / 0.15 : 1;
    c.save(); c.globalAlpha = Math.max(0, alpha);
    c.translate(W / 2, a.y); c.scale(scale, scale); c.rotate(-0.03);
    bigText(c, a.text, 0, 0, a.size, a.color, '#0b1530');
    if (a.sub) bigText(c, a.sub, 0, a.size * 0.75, a.size * 0.38, '#fff', '#0b1530');
    c.restore();
  },
  clear() { this.current = null; this.queue = []; try { speechSynthesis.cancel(); } catch (e) {} }
};

// ---------------- Skeleton ----------------
function skeleton(L, p) {
  const leg = (hip, a1, a2) => {
    const k = { x: hip.x + Math.sin(a1) * L.thigh, y: hip.y + Math.cos(a1) * L.thigh };
    const a = a1 - a2;
    return { hip, knee: k, foot: { x: k.x + Math.sin(a) * L.shin, y: k.y + Math.cos(a) * L.shin }, a };
  };
  // compute legs relative to hip (0,0) first for grounding
  let fl = leg({ x: 0, y: 0 }, p.fT, p.fK), bl = leg({ x: 0, y: 0 }, p.bT, p.bK);
  return { fl, bl };
}

function limb(c, pts, w, color, outline = true) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (outline) {
    c.strokeStyle = INK; c.lineWidth = w + 5;
    c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.stroke();
  }
  c.strokeStyle = color; c.lineWidth = w;
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.stroke();
}
function seg(c, a, b, w, color) { limb(c, [a, b], w, color); }

// Coat tails / jacket flaps drawn over the legs
function drawTails(c, L, lean, fT, bT) {

// ---------------- Full fighter ----------------
// opts: { pose, facing, expr, t, blink, prop, alpha, tint, scale }
function drawCharacter(c, L, x, y, o) {
  if (o.sprite !== false && hasSprites(L.id)) return drawSprite(c, L.id, o.spriteKey || 'idle', x, y, o);
  const p = o.pose;
  c.save();
  c.translate(x, y);
  const s = o.scale || 1;
  c.scale((o.facing || 1) * s, s);
  if (o.alpha != null) c.globalAlpha = o.alpha;
  if (p.rot) { c.translate(0, p.dy); c.rotate(p.rot); }

  const { fl, bl } = skeleton(L, p);
  // ground the lowest point (feet or knees)
  let low = Math.max(fl.foot.y, bl.foot.y, fl.knee.y - 4, bl.knee.y - 4);
  if (o.air) low = L.thigh + L.shin - 12;
  const hip = { x: p.hx, y: -low - 6 };
  const off = (pt) => ({ x: pt.x + hip.x, y: pt.y + hip.y });
  const T = L.torso;
  const neck = { x: hip.x + Math.sin(p.lean) * T, y: hip.y - Math.cos(p.lean) * T };
  const shoulderOf = (side) => {
    const sx = side > 0 ? 8 : -12;
    return { x: neck.x + Math.cos(p.lean) * sx + Math.sin(p.lean) * 12, y: neck.y + 12 + Math.sin(p.lean) * -sx };
  };
  const arm = (sh, a1, a2) => {
    const e = { x: sh.x + Math.sin(a1) * L.uArm, y: sh.y + Math.cos(a1) * L.uArm };
    const a = a1 + a2;
    return { sh, el: e, hand: { x: e.x + Math.sin(a) * L.fArm, y: e.y + Math.cos(a) * L.fArm }, a };
  };
  const fa = arm(shoulderOf(1), p.fA, p.fE), ba = arm(shoulderOf(-1), p.bA, p.bE);
  const LW = L.limbW;
  const sleeveCol = (front) => front ? L.top : L.topD;
  const drawArm = (A, front) => {
    const handCol = L.glove || L.skin;
    if (L.sleeve === 'long') {
      limb(c, [A.sh, A.el, A.hand], LW - 3, sleeveCol(front));
      if (L.outfit === 'suit') { const cuff = { x: lerp(A.el.x, A.hand.x, .82), y: lerp(A.el.y, A.hand.y, .82) }; seg(c, cuff, A.hand, LW - 8, L.under); }
    } else {
      limb(c, [A.sh, A.el, A.hand], LW - 7, front ? L.skin : L.skinD);
      const mid = { x: lerp(A.sh.x, A.el.x, .55), y: lerp(A.sh.y, A.el.y, .55) };
      limb(c, [A.sh, mid], LW - 1, sleeveCol(front));
    }

    dot(c, A.hand.x, A.hand.y, 9.5, front ? handCol : shade(handCol), INK, 2.5);
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(A.hand.x - 3, A.hand.y - 6); c.lineTo(A.hand.x - 3, A.hand.y + 4); c.stroke();
  };
  const drawLeg = (lg, front) => {
    const h = off(lg.hip), k = off(lg.knee), f = off(lg.foot);
    limb(c, [h, k, f], LW + 2, front ? L.pants : L.pantsD);
    // shoe
    c.save(); c.translate(f.x, f.y); c.rotate(-(lg.a) * 0.6);
    ell(c, 9, 2, 17, 7.5, front ? L.shoe : shade(L.shoe));
    c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(-2, 4, 22, 2);
    c.restore();
  };

  drawArm(ba, false);
  drawLeg(bl, false);
  drawLeg(fl, true);
  // torso
  c.save(); c.translate(hip.x, hip.y); c.rotate(p.lean);
  drawTorso(c, L, o.t || 0);
  c.restore();
  c.save(); c.translate(hip.x, hip.y); drawTails(c, L, p.lean, p.fT, p.bT); c.restore();
  // head
  c.save(); c.translate(neck.x, neck.y + 4); c.rotate(p.lean * 0.6 + p.head); c.scale(1.13, 1.13);
  drawHeadAny(c, L, o.expr || 'normal', o.t || 0, o.blink);
  c.restore();
  drawArm(fa, true);
  if (o.prop) drawProp(c, o.prop, fa.hand, fa.a, o.t || 0);
  c.restore();
  return { hand: fa.hand, neck, hip };
}

function shade(hex, k = 0.78) {
  if (!hex || hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.floor(((n >> 16) & 255) * k), g = Math.floor(((n >> 8) & 255) * k), b = Math.floor((n & 255) * k);
  return `rgb(${r},${g},${b})`;
}

// Props held in the front hand
function drawProp(c, prop, h, a, t) {

    rr(c, -10, -100, 20, 28, 6); c.fillStyle = 'rgba(170,230,255,.85)'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.font = 'bold 7px sans-serif'; c.textAlign = 'center'; c.fillText('NS', 0, -84);
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(0, 110); c.lineTo(22 * s, 120); c.strokeStyle = '#8c96a0'; c.lineWidth = 4; c.stroke(); dot(c, 22 * s, 122, 4, '#333', null); }
  } else if (prop === 'clipboard') {

    rr(c, -14, -40, 30, 40, 3); c.fillStyle = '#b07a3e'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-10, -34, 22, 30); c.fillStyle = '#999'; c.fillRect(-4, -43, 10, 6);
    c.fillStyle = '#2a7'; for (let i = 0; i < 4; i++) c.fillRect(-7, -30 + i * 7, 14, 2);

    c.rotate(a - Math.PI / 2);
    c.fillStyle = '#ffd23f'; c.beginPath(); c.ellipse(0, 0, 10, 5, 0, 0, TAU); c.fill();

  }
  c.restore();
}

// ---------------- Illustrated art: showcase pictures & pose sprites ----------------
for (const k in LOOKS) LOOKS[k].id = k;
function loadImg(src, cb) { const im = new Image(); im.onload = () => cb(im); im.src = src; }
const ShowcaseImages = {};
if (typeof SHOWCASE_DATA !== 'undefined') for (const k in SHOWCASE_DATA) loadImg(SHOWCASE_DATA[k], im => { ShowcaseImages[k] = im; });
const hasShowcase = id => !!ShowcaseImages[id];
// Draw a showcase illustration "cover"-fitted into a rounded frame. fx/fy = focus point (0..1) kept in view.
function drawShowcase(c, id, x, y, w, h, o = {}) {
  const im = ShowcaseImages[id]; if (!im) return false;
  const fx = o.fx ?? 0.5, fy = o.fy ?? 0.3, r = o.radius ?? 14, zoom = o.zoom || 1;
  const s = Math.max(w / im.width, h / im.height) * zoom;
  const dw = im.width * s, dh = im.height * s;
  const dx = clamp(x + w / 2 - fx * dw, x + w - dw, x), dy = clamp(y + h / 2 - fy * dh, y + h - dh, y);
  c.save();
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = 30; rr(c, x, y, w, h, r); c.fillStyle = '#000'; c.fill(); c.shadowBlur = 0; }
  rr(c, x, y, w, h, r); c.clip();
  if (o.flip) { c.translate(x * 2 + w, 0); c.scale(-1, 1); }
  c.drawImage(im, dx, dy, dw, dh);
  c.restore();
  if (o.border !== false) { c.save(); rr(c, x, y, w, h, r); c.strokeStyle = o.border || '#fff'; c.lineWidth = 4; c.stroke(); c.restore(); }
  return true;
}

// Pose sprites: SPRITE_DATA[id] = { scale, poses: { idle: {src, ax, ay}, ... } } (tools/make_sprites.py).
// Images face RIGHT; (ax, ay) is the point between the feet, in image pixels.
const SPRITE_POSES = ['idle', 'walk1', 'walk2', 'jump', 'lp', 'hp', 'lk', 'hk', 'block', 'hit', 'down', 'special', 'ultimate', 'win', 'lose'];
const SPRITE_FALLBACK = { walk1: 'idle', walk2: 'walk1', jump: 'idle', lp: 'hp', hp: 'special', lk: 'hk', hk: 'lp', block: 'idle', hit: 'idle', down: 'hit', special: 'hp', ultimate: 'special', win: 'idle', lose: 'hit' };
const SpriteSets = {};
if (typeof SPRITE_DATA !== 'undefined') for (const id in SPRITE_DATA) {
  const set = { scale: SPRITE_DATA[id].scale, poses: {} };
  for (const k in SPRITE_DATA[id].poses) { const d = SPRITE_DATA[id].poses[k]; loadImg(d.src, im => { set.poses[k] = { im, ax: d.ax, ay: d.ay }; }); }
  SpriteSets[id] = set;
}
const hasSprites = id => !!(SpriteSets[id] && SpriteSets[id].poses.idle);
function spritePose(set, key) {
  for (let i = 0; i < 8 && key; i++) { if (set.poses[key]) return set.poses[key]; key = SPRITE_FALLBACK[key]; }
  return set.poses.idle;
}
function drawSprite(c, id, key, x, y, o) {
  const set = SpriteSets[id], sp = spritePose(set, key), k = set.scale * (o.scale || 1);
  const t = o.t || 0;
  c.save(); c.translate(x, y);
  c.scale(o.facing || 1, 1);
  if (o.alpha != null) c.globalAlpha = o.alpha;
  // keep single drawings alive: breathing on idle, squash on hits
  let sx = 1, sy = 1;
  if (key === 'idle' || key === 'win') sy = 1 + Math.sin(t * 0.09) * 0.012;
  if (key === 'hit') { sx = 1.04; sy = 0.97; c.rotate(-0.06); }
  if (o.expr === 'shock') c.translate(Math.sin(t * 1.3) * 3, 0);
  c.scale(sx, sy);
  c.drawImage(sp.im, -sp.ax * k, -sp.ay * k, sp.im.width * k, sp.im.height * k);
  c.restore();
  if (o.expr === 'ko' || o.expr === 'hurt') {
    const hy = y - sp.ay * k * 0.92;
    if (o.expr === 'ko') for (let i = 0; i < 3; i++) { const a = t * 0.15 + i * TAU / 3; star(c, x + Math.cos(a) * 34, hy + Math.sin(a) * 8, 8, '#ffd23f'); }
  }
  return { hand: { x: 60, y: -200 }, neck: { x: 0, y: -240 }, hip: { x: 0, y: -130 } };
}

// Bust portrait (select screen / HUD)
function drawBust(c, L, x, y, size, expr = 'normal', t = 0, facing = 1) {
  c.save(); c.translate(x, y); c.scale(size * facing, size);
  if (L.head && HeadImages[L.head]) c.translate(0, 20);
  c.save(); c.translate(0, L.torso + 22); drawTorso(c, L, t); c.restore();
  c.save(); c.translate(0, 26); drawHeadAny(c, L, expr, t, false); c.restore();
  c.restore();
}

// Optional: externally supplied portrait art (assets/portraits/<id>.png). Falls back to procedural busts.
const PortraitImages = {};
function loadPortraitImages(ids) {
  // Opt-in (add ?portraits=1 to the URL) so the self-contained build makes no failing requests.
  if (!/[?&]portraits=1/.test(location.search)) return;
  for (const id of ids) {
    const img = new Image();
    img.onload = () => { PortraitImages[id] = img; };
    img.onerror = () => {};
    img.src = `assets/portraits/${id}.png`;
  }
}

// ---------- Particles & floating text ----------
class Particle {
  constructor(x, y, o) {
    this.x = x; this.y = y; this.vx = o.vx ?? rand(-6, 6); this.vy = o.vy ?? rand(-8, -2);
    this.g = o.g ?? 0.35; this.life = this.max = o.life ?? 30; this.size = o.size ?? rand(3, 7);
    this.color = o.color || '#fff'; this.kind = o.kind || 'dot'; this.rot = rand(0, TAU); this.vr = rand(-0.3, 0.3);
    this.layer = o.layer || 'front'; this.item = o.item; this.drag = o.drag ?? 0.98;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += this.g; this.vx *= this.drag; this.rot += this.vr; return --this.life > 0; }
  draw(c) {
    const a = Math.min(1, this.life / (this.max * 0.4));
    c.save(); c.globalAlpha = a; c.translate(this.x, this.y); c.rotate(this.rot);
    if (this.kind === 'dot') { c.fillStyle = this.color; c.beginPath(); c.arc(0, 0, this.size, 0, TAU); c.fill(); }
    else if (this.kind === 'spark') { c.strokeStyle = this.color; c.lineWidth = 3; c.beginPath(); c.moveTo(-this.size * 2, 0); c.lineTo(this.size * 2, 0); c.stroke(); }
    else if (this.kind === 'confetti') { c.fillStyle = this.color; c.fillRect(-this.size, -this.size / 2, this.size * 2, this.size); }
    else if (this.kind === 'star') { star(c, 0, 0, this.size, this.color); }
    else if (this.kind === 'item') { ITEMS[this.item](c, this.size); }
    else if (this.kind === 'smoke') { c.fillStyle = this.color; c.globalAlpha = a * 0.5; c.beginPath(); c.arc(0, 0, this.size * (2 - a), 0, TAU); c.fill(); }
    c.restore();
  }
}
class FloatText {
  constructor(x, y, text, color = '#fff', size = 34, life = 50) { this.x = x; this.y = y; this.text = text; this.color = color; this.size = size; this.life = this.max = life; this.layer = 'front'; }
  update() { this.y -= 1.2; return --this.life > 0; }
  draw(c) {
    const t = 1 - this.life / this.max; const s = t < 0.15 ? easeOutBack(t / 0.15) : 1;
    c.save(); c.globalAlpha = Math.min(1, this.life / 15); c.translate(this.x, this.y); c.scale(s, s);
    bigText(c, this.text, 0, 0, this.size, this.color); c.restore();
  }
}
class ComicBurst {
  constructor(x, y, text, color = '#ffd23f', size = 1) { this.x = x; this.y = y; this.text = text; this.color = color; this.s = size; this.life = 26; this.layer = 'front'; this.rot = rand(-0.3, 0.3); }

  draw(c) {

    c.save(); c.globalAlpha = Math.min(1, this.life / 8); c.translate(this.x, this.y); c.rotate(this.rot); c.scale(s, s);

class Ring {

// ---------- Projectiles ----------
// Generic projectile with a custom drawer. hit = hit definition passed to g.applyHit
class Projectile {
  constructor(g, owner, o) {
    this.g = g; this.owner = owner; this.x = o.x; this.y = o.y; this.vx = o.vx; this.vy = o.vy || 0; this.grav = o.grav || 0;
    this.w = o.w || 60; this.h = o.h || 50; this.hit = o.hit; this.drawFn = o.draw; this.life = o.life || 120; this.t = 0;
    this.wave = o.wave || 0; this.waveAmp = o.waveAmp || 0; this.baseY = o.y; this.spin = o.spin || 0; this.layer = 'front';
    this.isProjectile = true; this.noFlip = !!o.noFlip; this.dead = false; this.trail = o.trail || null; this.clash = o.clash !== false;
  }
  box() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
  update() {
    if (this.dead) return false;
    this.t++; this.x += this.vx; this.vy += this.grav; this.y += this.vy;
    if (this.wave) this.y = this.baseY + Math.sin(this.t * this.wave) * this.waveAmp;
    if (this.trail && this.t % 2 === 0) this.g.fx.push(new Particle(this.x - Math.sign(this.vx) * 20, this.y, { kind: 'dot', color: this.trail, vx: rand(-1, 1), vy: rand(-1, 1), g: 0, life: 16, size: rand(3, 6) }));
    const opp = this.g.other(this.owner);
    if (opp.hittable() && overlap(this.box(), opp.hurtbox())) {
      this.g.applyHit(this.owner, opp, this.hit, this.x);
      this.dead = true;
      sparks(this.g, this.x, this.y, '#ffd23f', 10);
      return false;
    }
    if (this.y > FLOOR + 10 || this.x < -200 || this.x > STAGE_W + 200) return false;
    return --this.life > 0;
  }
  draw(c) {
    c.save(); c.translate(this.x, this.y);
    if (this.vx < 0 && !this.noFlip) c.scale(-1, 1);
    if (this.spin) c.rotate(this.t * this.spin);
    this.drawFn(c, this.t);
    c.restore();
  }
}

// Timed effect: arbitrary update/draw with frame counter (summons, auras, traps)
class Timed {
  constructor(dur, o) { this.t = 0; this.dur = dur; this.u = o.update || (() => {}); this.d = o.draw || (() => {}); this.layer = o.layer || 'front'; this.data = o.data || {}; }
  update() { this.u(this.t, this); return ++this.t < this.dur && !this.kill; }
  draw(c) { this.d(c, this.t, this); }
}

function wrapText(c, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = ''; const lines = [];
  for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line);
  const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => c.fillText(l, x, y0 + i * lh));
  return lines.length;
}

// CPU AI
// ============================================================
const AI_LEVELS = [
  { react: 26, block: 0.12, aggro: 0.35, special: 0.010, combo: 0.15, antiProj: 0.15, dmg: 0.8 },
  { react: 16, block: 0.38, aggro: 0.55, special: 0.020, combo: 0.45, antiProj: 0.4, dmg: 1.0 },
  { react: 9, block: 0.62, aggro: 0.7, special: 0.032, combo: 0.7, antiProj: 0.65, dmg: 1.1 },
  { react: 4, block: 0.85, aggro: 0.85, special: 0.045, combo: 0.92, antiProj: 0.85, dmg: 1.25 }
];
class AI {
  constructor(f, level, mode = 'cpu') { this.f = f; this.L = AI_LEVELS[level]; this.mode = mode; this.wait = 0; this.hold = {}; this.holdT = 0; this.queue = []; this.lastOppState = ''; }
  think(g) {
    const f = this.f, o = g.other(f), L = this.L;
    const held = {}, pressed = {};
    const fwd = f.facing > 0 ? 'right' : 'left', back = f.facing > 0 ? 'left' : 'right';
    if (this.mode === 'stand') return { held, pressed };
    if (this.mode === 'block') { held.down = true; return { held, pressed }; }
    // continue holds
    if (this.holdT > 0) { this.holdT--; Object.assign(held, this.hold); }
    // combo queue executes on cancel windows
    if (this.queue.length) {
      if (f.state === 'attack' && f.atkHit && f.st >= f.atk.s + 1 || f.canAct()) {
        const nx = this.queue.shift();
        if (nx === 'sp') { pressed.sp = true; } else if (nx === 'ult') pressed.ult = true; else pressed[nx] = true;
        return { held, pressed };
      }
      if (f.state === 'attack' && !f.atkHit && f.st > f.atk.s + f.atk.a) this.queue = [];
      return { held, pressed };
    }
    const dist = Math.abs(o.x - f.x);
    // reactive defense (checked every frame but gated by reaction time)
    const threat = (o.state === 'attack' && dist < 240 && o.st < (o.atk ? o.atk.s + o.atk.a : 0)) ||
                   (o.state === 'cast' && dist < 200) ||
                   g.fx.some(p => p.isProjectile && p.owner === o && !p.dead && Math.abs(p.x - f.x) < 260 && Math.sign(p.vx) === Math.sign(f.x - p.x));
    if (threat && f.canAct()) {
      if (this.reactT == null) this.reactT = L.react;
      if (--this.reactT <= 0) {
        this.reactT = null;
        if (Math.random() < L.block) {
          if (Math.random() < L.antiProj * 0.3 && f.dodgeCd <= 0) { held.down = true; pressed[back] = true; }
          else { this.hold = { down: true }; this.holdT = 20; held.down = true; }
          return { held, pressed };
        }
      }
    } else this.reactT = null;

    if (--this.wait > 0) return { held, pressed };
    this.wait = Math.max(2, Math.round(L.react * rand(0.4, 1.0)));
    if (!f.canAct()) return { held, pressed };
    if (o.state === 'down' || o.state === 'getup') { if (dist < 140) { this.hold = { [back]: true }; this.holdT = 10; } return { held, pressed }; }

    // Ultimate
    if (f.energy >= 100 && Math.random() < L.aggro * 0.25 && dist < 700) { pressed.ult = true; return { held, pressed }; }
    // Specials
    const ready = f.def.specials.filter(s => !(f.cd[s.name] > 0) && s.input !== 'AIR');
    if (ready.length && Math.random() < L.special * this.wait) {
      const s = pick(ready);
      if (s.input === 'F') held[fwd] = true; if (s.input === 'B') held[back] = true; if (s.input === 'D') held.down = true;
      pressed.sp = true; return { held, pressed };
    }
    if (dist > 165) {
      const r = Math.random();
      if (r < L.aggro * 0.12 && dist < 450) { held.up = true; held[fwd] = true; this.queue = [pick(['hk', 'hp', 'lk'])]; this.qDelay = 12; return { held, pressed }; }
      if (r < L.aggro) { this.hold = { [fwd]: true }; this.holdT = randi(8, 22); held[fwd] = true; }
      else if (r < L.aggro + 0.12) { this.hold = { [back]: true }; this.holdT = randi(6, 14); }
      return { held, pressed };
    }
    // close range: attack strings
    const r = Math.random();
    if (r < L.aggro) {
      const strings = [['lp', 'lp', 'hp'], ['lk', 'hp'], ['lp', 'lk', 'hk'], ['hp', 'sp'], ['lp', 'hp', 'sp'], ['hk'], ['lk', 'lk', 'hp', 'sp']];
      let s = pick(strings);
      if (Math.random() > L.combo) s = [s[0]];
      if (s.includes('sp') && f.energy >= 100 && Math.random() < 0.5) s = s.map(x => x === 'sp' ? 'ult' : x);
      pressed[s[0]] = true; this.queue = s.slice(1);
      return { held, pressed };
    }
    if (r < L.aggro + 0.15) { this.hold = { down: true }; this.holdT = 18; held.down = true; }
    else { this.hold = { [back]: true }; this.holdT = 10; }
    return { held, pressed };
  }
}

function parallax(c, cam, p, fn) { c.save(); c.translate((cam.x - STAGE_W / 2) * (1 - p), 0); fn(); c.restore(); }
function gradRect(c, x, y, w, h, stops) {
  const g = c.createLinearGradient(0, y, 0, y + h); stops.forEach(([o, col]) => g.addColorStop(o, col)); c.fillStyle = g; c.fillRect(x, y, w, h);
}
function tileFloor(c, col1, col2, line = 'rgba(0,0,0,.12)') {
  gradRect(c, -400, FLOOR - 10, STAGE_W + 800, 200, [[0, col1], [1, col2]]);
  c.strokeStyle = line; c.lineWidth = 2;
  for (let i = -10; i < 40; i++) { c.beginPath(); c.moveTo(i * 80, FLOOR - 10); c.lineTo(i * 80 + (i * 80 - STAGE_W / 2) * 0.35, FLOOR + 190); c.stroke(); }
  for (let j = 0; j < 4; j++) { c.beginPath(); c.moveTo(-400, FLOOR + 10 + j * j * 14); c.lineTo(STAGE_W + 400, FLOOR + 10 + j * j * 14); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(-400, FLOOR - 10, STAGE_W + 800, 6);
}
// generic background staffer (faceless silhouette, cartoon)
function staffer(c, x, y, s, col, t, walking = true, skin = '#c99a74') {
  c.save(); c.translate(x, y); c.scale(s, s);
  const sw = walking ? Math.sin(t * 0.25) * 0.5 : 0;
  c.lineCap = 'round';
  c.strokeStyle = shade(col, 0.75); c.lineWidth = 16;
  c.beginPath(); c.moveTo(0, -95); c.lineTo(Math.sin(sw) * 40, -95 + Math.cos(sw) * 90); c.stroke();
  c.beginPath(); c.moveTo(0, -95); c.lineTo(-Math.sin(sw) * 40, -95 + Math.cos(sw) * 90); c.stroke();
  rr(c, -22, -190, 44, 100, 14); c.fillStyle = col; c.fill();
  c.strokeStyle = col; c.lineWidth = 12; c.beginPath(); c.moveTo(-14, -180); c.lineTo(-14 - Math.sin(sw) * 30, -110); c.stroke();
  dot(c, 0, -212, 20, skin, null);
  c.restore();
}

'use strict';
// ============================================================
// Match: rounds, combat resolution, camera, cinematics, HUD
// ============================================================
const ROUND_NAMES = ['ONE', 'TWO', 'THREE', 'FOUR', 'FIVE'];
const HIT_WORDS = ['POW!', 'BAM!', 'WHAM!', 'BONK!', 'THWACK!', 'SMACK!', 'KAPOW!'];

class Match {
  // opts: { p1, p2 (defs), arena (index), mode: 'arcade'|'cpu'|'versus'|'training', p2cpu: bool, onEnd(result) }
  constructor(opts) {
    this.o = opts; this.mode = opts.mode;
    this.arena = ARENAS[opts.arena];
    this.fighters = [new Fighter(opts.p1, 0, this), new Fighter(opts.p2, 1, this)];
    const diff = Settings.difficulty;
    const single = opts.mode !== 'versus';
    this.ctrl = [
      { human: true, layouts: single ? [KEYMAP_P1, KEYMAP_P2] : [KEYMAP_P1], pad: 0, touch: true },
      opts.mode === 'versus' ? { human: true, layouts: [KEYMAP_P2], pad: 1, touch: false } : { human: false, ai: new AI(this.fighters[1], diff, opts.mode === 'training' ? 'stand' : 'cpu') }
    ];
    this.fighters[0].ctrlHuman = true; this.fighters[1].ctrlHuman = this.ctrl[1].human;
    if (!this.ctrl[1].human) this.fighters[1].dmgMult = AI_LEVELS[diff].dmg;
    this.round = 1; this.wins = [0, 0]; this.frame = 0; this.matchFrames = 0;
    this.cam = { x: STAGE_W / 2, zoom: 1, shake: 0 }; this.hitstop = 0; this.slow = 0;
    this.popups = []; this.timers = []; this.lastAnnounce = -999; this.cine = null;
    this.paused = false; this.pauseSel = 0; this.showMoves = false;
    this.training = opts.mode === 'training';
    this.startRound();
    AudioSys.playMusic(this.arena.music);
  }
  other(f) { return f === this.fighters[0] ? this.fighters[1] : this.fighters[0]; }
  later(d, fn) { this.timers.push({ t: d, fn }); }
  addShake(n) { this.cam.shake = Math.max(this.cam.shake, n); }
  floatText(x, y, text, color = '#fff', size = 34) { this.fx.push(new FloatText(x, y, text, color, size)); }
  poof(x, y) { for (let i = 0; i < 14; i++) this.fx.push(new Particle(x + rand(-30, 30), y + rand(-80, 80), { kind: 'smoke', color: '#e8f6ff', vx: rand(-2, 2), vy: rand(-2, 1), g: 0, life: 26, size: rand(10, 18) })); sparks(this, x, y, '#7fd6ff', 10); }
  dust(x) { for (let i = 0; i < 10; i++) this.fx.push(new Particle(x + rand(-50, 50), FLOOR - 5, { kind: 'smoke', color: '#d8d0c0', vx: rand(-3, 3), vy: rand(-2, 0), g: 0, life: 24, size: rand(8, 14) })); }
  announce(text, opts = {}) {
    if (!opts.force && this.frame - this.lastAnnounce < 70) { if (Announcer.current && Announcer.current.t < 40) return; }
    this.lastAnnounce = this.frame; Announcer.say(text, opts);
  }
  specialFlash(f, name) {
    this.camPunch = { f, t: 16 };
    this.fx.push(new FloatText(f.x, f.y - 320, name, f.def.color, 30, 55));
    this.banner = { side: f.side, text: name, t: 0 };
    AudioSys.sfx('magic');
  }
  cdMult(f) { return this.training ? 0.35 : 1; }

  startRound() {
    const [a, b] = this.fighters;
    a.resetRound(STAGE_W / 2 - 250); b.resetRound(STAGE_W / 2 + 250);
    this.fx = []; this.timers = []; this.cine = null; this.popups = [];
    this.phase = 'intro'; this.pt = 0; this.timer = (Settings.roundTime || 9999) * 60; this.winner = null; this.lowWarned = [false, false];
    this.popT = randi(600, 1100); this.cam.x = STAGE_W / 2;
    if (this.training) { this.phase = 'fight'; a.set('idle'); b.set('idle'); Announcer.say('TRAINING MODE', { size: 70, voice: false }); }
  }

  readCtl(i) {
    const c = this.ctrl[i];
    if (this.phase !== 'fight' || this.paused) return { held: {}, pressed: {} };
    if (c.human) return Input.read(c.layouts, c.pad, c.touch && Touch.enabled());
    return c.ai.think(this);
  }

  update() {
    // pause handling
    if (Input.menu('pause') && this.phase !== 'end') { this.paused = !this.paused; this.pauseSel = 0; this.showMoves = false; AudioSys.sfx(this.paused ? 'back' : 'confirm'); return; }
    if (this.paused) return this.updatePause();
    this.frame++;
    if (this.hitstop > 0) { this.hitstop--; return; }
    if (this.slow > 0) { this.slow--; if (this.slow % 3 !== 0) return; }

    for (let i = this.timers.length - 1; i >= 0; i--) if (--this.timers[i].t <= 0) { const tm = this.timers.splice(i, 1)[0]; tm.fn(); }

    const [a, b] = this.fighters;
    if (this.cine) this.updateCine();
    else {
      const c0 = this.readCtl(0), c1 = this.readCtl(1);
      a.update(c0); b.update(c1);
      this.separate();
    }
    this.fx = this.fx.filter(e => e.update());
    // projectile clashes
    const ps = this.fx.filter(e => e.isProjectile && !e.dead && e.clash);
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
      if (ps[i].owner !== ps[j].owner && overlap(ps[i].box(), ps[j].box())) { ps[i].dead = ps[j].dead = true; sparks(this, (ps[i].x + ps[j].x) / 2, ps[i].y, '#fff', 18); this.fx.push(new ComicBurst((ps[i].x + ps[j].x) / 2, ps[i].y, 'CLASH!', '#7fd6ff', 0.9)); AudioSys.sfx('hitH'); }
    }
    this.popups = this.popups.filter(p => p.update());
    if (this.banner && ++this.banner.t > 70) this.banner = null;
    this.updatePhase();
    this.updateCamera();
    for (const f of this.fighters) f.dispHp = f.dispHp > f.hp ? Math.max(f.hp, f.dispHp - (this.frame % 1 === 0 ? 6 : 0)) : f.hp;
    // arena ambience
    if (this.frame % 420 === 200 && this.phase === 'fight') AudioSys.sfx(pick(this.arena.ambient));
  }

  separate() {
    const [a, b] = this.fighters;
    const dx = b.x - a.x, minD = 64;
    const vOverlap = Math.abs(a.y - b.y) < 200;
    if (Math.abs(dx) < minD && vOverlap && a.state !== 'down' && b.state !== 'down') {
      const push = (minD - Math.abs(dx)) / 2 * (dx >= 0 ? 1 : -1);
      a.x -= push; b.x += push;
      if (a.x < 50) { b.x += 50 - a.x; a.x = 50; } if (b.x > STAGE_W - 50) { a.x -= b.x - (STAGE_W - 50); b.x = STAGE_W - 50; }
      if (b.x < 50) { a.x += 50 - b.x; b.x = 50; } if (a.x > STAGE_W - 50) { b.x -= a.x - (STAGE_W - 50); a.x = STAGE_W - 50; }
    }
    const maxD = 1120;
    if (Math.abs(b.x - a.x) > maxD) { const mid = (a.x + b.x) / 2, s = Math.sign(b.x - a.x); a.x = mid - s * maxD / 2; b.x = mid + s * maxD / 2; }
  }

  updateCamera() {
    const [a, b] = this.fighters; const cam = this.cam;
    let tx = (a.x + b.x) / 2, tz = clamp(1.12 - Math.abs(a.x - b.x) / 2400, 1.0, 1.08);
    if (this.cine) {
      const k = this.cine;
      if (k.t < 45) { tx = k.caster.x; tz = 1.35; } else { tx = (k.target.x * 2 + k.caster.x) / 3; tz = 1.06; }
    } else if (this.camPunch && this.camPunch.t > 0) { this.camPunch.t--; tx = lerp(tx, this.camPunch.f.x, 0.4); tz += 0.1; }
    if (this.phase === 'ko' && this.pt < 70 && this.loser) { tx = this.loser.x; tz = 1.3; }
    cam.zoom = lerp(cam.zoom, tz, 0.08);
    cam.x = lerp(cam.x, tx, 0.12);
    const half = W / 2 / cam.zoom;
    cam.x = clamp(cam.x, half, STAGE_W - half);
    cam.shake *= 0.86; if (cam.shake < 0.3) cam.shake = 0;
  }

  updatePhase() {
    this.pt++;
    const [a, b] = this.fighters;
    if (this.phase === 'intro') {
      if (this.pt === 20) {
        const last = this.wins[0] === 1 && this.wins[1] === 1;
        this.announce(last ? 'FINAL ROUND — OVERTIME!' : `ROUND ${ROUND_NAMES[this.round - 1] || this.round}`, { force: true, size: 90, sub: last ? null : 'BEGIN YOUR SHIFT!', dur: 100, speak: last ? 'Final round. Overtime!' : `Round ${['one', 'two', 'three', 'four', 'five'][this.round - 1]}. Begin your shift!` });
      }
      if (this.pt === 135) { this.announce('FIGHT!', { force: true, size: 140, color: '#ff3b3b', dur: 50 }); AudioSys.sfx('hitH'); }
      if (this.pt >= 150) { this.phase = 'fight'; this.pt = 0; a.set('idle'); b.set('idle'); }
      return;
    }
    if (this.phase === 'fight') {
      this.matchFrames++;
      if (this.training) {
        a.energy = 100;
        for (const f of this.fighters) { if (f.hp < f.maxHp && f.state === 'idle' && this.other(f).combo === 0) f.hp = Math.min(f.maxHp, f.hp + 8); if (f.hp <= 1) f.hp = f.maxHp; }
        return;
      }
      if (!this.cine && Settings.roundTime) { this.timer--; if (this.timer % 60 === 0 && this.timer <= 600 && this.timer > 0) AudioSys.sfx('tick'); }
      // low health callouts
      this.fighters.forEach((f, i) => { if (!this.lowWarned[i] && f.hp > 0 && f.hp < f.maxHp * 0.22) { this.lowWarned[i] = true; this.announce('FINISH THE CHART!', { color: '#ff3b3b', size: 80 }); } });
      // comedy pop-ups
      if (Settings.popups && --this.popT <= 0) { this.popT = randi(780, 1400); this.spawnPopup(); }
      if (!this.cine) for (const f of this.fighters) if (f.hp <= 0 && !f.ko) { this.ko(this.other(f), f, false); break; }
      if (this.timer <= 0 && !this.cine && this.phase === 'fight') this.timeOut();
      return;
    }
    if (this.phase === 'ko') {
      if (this.pt === 120) {
        const w = this.winner;
        if (w) { w.set('win'); if (this.loser) this.loser.set('lose'); }
        else { a.set('lose'); b.set('lose'); }
      }
      if (this.pt === 150 && this.winner) {
        if (this.winner.hp >= this.winner.maxHp) this.announce('PERFECT SHIFT!', { force: true, size: 100, color: '#7cf28b' });
        else this.announce(`${this.winner.def.name} WINS`, { force: true, size: 80, color: this.winner.def.color, speak: `${this.winner.def.name.toLowerCase()} wins` });
        AudioSys.sfx('cheer'); confetti(this, this.winner.x, this.winner.y - 400, 50);
      }
      if (this.pt >= 290) {
        if (this.winner) this.wins[this.winner.side]++;
        const done = this.wins[0] >= 2 || this.wins[1] >= 2 || this.round >= 5;
        if (done) { this.phase = 'end'; this.endMatch(); }
        else { this.round++; this.startRound(); }
      }
    }
  }

  timeOut() {
    const [a, b] = this.fighters;
    this.phase = 'ko'; this.pt = 0;
    this.winner = a.hp === b.hp ? null : a.hp > b.hp ? a : b; this.loser = this.winner ? this.other(this.winner) : null;
    this.announce('TIME! DOCUMENTATION INCOMPLETE!', { force: true, size: 70, color: '#ffd23f', speak: 'Time! Documentation incomplete!' });
  }

  ko(att, def, viaUlt) {
    if (this.phase !== 'fight') return;
    def.ko = true; this.phase = 'ko'; this.pt = 0; this.winner = att; this.loser = def;
    this.slow = 90; AudioSys.sfx('ko'); this.addShake(18);
    const finals = ['DISCHARGED!', 'SHIFT COMPLETE!'];
    const txt = viaUlt ? att.def.ult.final : pick(finals);
    this.announce(txt, { force: true, size: 120, color: '#ff3b3b', dur: 110 });
    if (!viaUlt) { def.set('air'); def.vy = -12; def.vx = (def.x > att.x ? 1 : -1) * 8; def.y -= 2; }
  }

  endMatch() {
    const w = this.wins[0] > this.wins[1] ? 0 : this.wins[1] > this.wins[0] ? 1 : (this.fighters[0].hp >= this.fighters[1].hp ? 0 : 1);
    AudioSys.playMusic('win');
    this.o.onEnd && this.o.onEnd({ winner: w, fighters: this.fighters, time: this.matchFrames, match: this });
  }

  spawnPopup() {
    const p = pick(POPUPS); let who = null;
    if (p.effect === 'cooldown') { const f = pick(this.fighters); who = f.def.name; for (const s of f.def.specials) f.cd[s.name] = Math.max(f.cd[s.name] || 0, 150); }
    if (p.effect === 'energy') for (const f of this.fighters) f.energy = Math.min(100, f.energy + 15);
    this.popups.push(new Popup(p, who));
    if (this.popups.length > 2) this.popups.shift();
    AudioSys.sfx('notify');
  }

  // ---------- combat resolution ----------
  applyHit(a, d, h, srcX) {
    if (this.cine || !d.hittable()) return false;
    const blocked = !h.unblockable && d.isBlockingFrom(srcX) && d.grounded();
    let dmg = h.dmg * a.def.stats.power / d.def.stats.defense * (a.dmgMult || 1);
    const dir = Math.sign(d.x - srcX) || a.facing;
    if (blocked) {
      dmg = Math.round(dmg * 0.12);
      d.hp = Math.max(1, d.hp - dmg);
      d.set('blockstun'); d.hitstun = Math.round((h.stun || 12) * 0.7); d.vx = dir * Math.max(3, (h.kb || 3) * 0.9);
      a.energy = Math.min(100, a.energy + 3); d.energy = Math.min(100, d.energy + 5); d.stats.blocks++;
      sparks(this, d.x - dir * 30, d.y - 170, '#7fd6ff', 10); this.fx.push(new Ring(d.x - dir * 30, d.y - 170, '#7fd6ff', 50, 12));
      AudioSys.sfx('block'); this.hitstop = 4;
      return 'blocked';
    }
    const comboing = ['hit', 'air', 'stun', 'freeze', 'trap'].includes(d.state);
    a.combo = comboing ? a.combo + 1 : 1; a.comboT = 75; a.stats.maxCombo = Math.max(a.stats.maxCombo, a.combo);
    const scale = Math.max(0.35, 1 - 0.09 * (a.combo - 1));
    const crit = !h.chip && Math.random() < (a.status.vein > 0 ? 0.3 : 0.05);
    dmg = Math.round(dmg * scale * (crit ? 1.5 : 1) * (a.status.vein > 0 ? 1.25 : 1));
    d.hp = Math.max(0, d.hp - dmg); d.stats.taken += dmg;
    a.stats.dmg += dmg; a.stats.hits++;
    a.energy = Math.min(100, a.energy + (h.energy || 8)); d.energy = Math.min(100, d.energy + dmg * 0.05);
    d.flash = 8; d.pullTo = null;
    // reaction
    if (h.effect && d.hp > 0) {
      const ty = h.effect.type; d.set(ty); d.status[ty] = h.effect.dur; d.vx = dir * 2;
      if (ty === 'freeze') { sparks(this, d.x, d.y - 150, '#bff3ff', 20, 'dot'); }
    } else if (h.launch || !d.grounded() || d.state === 'air' || h.kd) {
      d.juggle++;
      d.set('air'); d.vy = h.launch || (h.kd ? -9 : d.juggle > 3 ? 3 : -7.5); d.vx = dir * (h.kb || 3) * (h.kd ? 0.9 : 0.55); d.y = Math.min(d.y, FLOOR - 2);
    } else {
      d.set('hit'); d.hitstun = h.stun || 14; d.vx = dir * (h.kb || 3);
    }
    // attacker pushback in the corner
    if (h.normal && (d.x < 80 || d.x > STAGE_W - 80)) a.vx -= a.facing * 3;
    // juice
    const hx = d.x - dir * 20, hy = d.y - 170 + (h.launch ? 30 : 0);
    this.hitstop = crit ? 10 : h.dmg >= 70 ? 7 : 4;
    if (h.shake) this.addShake(h.shake);
    sparks(this, hx, hy, crit ? '#ff3b3b' : '#fff8c0', crit ? 22 : 12);
    this.fx.push(new Ring(hx, hy, crit ? '#ff3b3b' : '#fff', crit ? 110 : 70));
    if (h.burst || crit || h.dmg >= 85) this.fx.push(new ComicBurst(hx + rand(-30, 30), hy - 60, crit ? 'CRIT!' : pick(HIT_WORDS), crit ? '#ff3b3b' : pick(['#ffd23f', '#ff5a8a', '#3bb3ff', '#7cf28b']), crit ? 1.2 : 1));
    this.fx.push(new FloatText(d.x + rand(-20, 20), d.y - 280, String(dmg), crit ? '#ff3b3b' : '#fff', crit ? 40 : 28, 40));
    if (h.text) this.fx.push(new FloatText(d.x, d.y - 330, h.text, h.textColor || '#ffd23f', 40, 60));
    AudioSys.sfx(crit ? 'crit' : (h.sfx || 'hitL'));
    if (h.sfx && h.sfx !== 'hitL' && h.sfx !== 'hitH') AudioSys.sfx(h.dmg >= 60 ? 'hitH' : 'hitL');
    if (crit) this.announce('CRITICAL HIT!', { size: 80, color: '#ff3b3b' });
    else if (h.announce) this.announce(h.announce, { size: 80, color: h.textColor || '#ffd23f' });
    if (d.hp <= 0) {
      if (this.training) { d.hp = d.maxHp; return true; }
      this.ko(a, d, false);
    }
    return true;
  }

  // ---------- ultimate cinematics ----------
  startCine(f) {
    const o = this.other(f), def = f.def.ult;
    this.cine = { caster: f, target: o, t: 0, def, tx: o.x, per: Math.round(def.dmg * f.def.stats.power / o.def.stats.defense * (f.dmgMult || 1) / def.hits.length) };
    f.set('ult'); f.vx = 0; f.faceOpp();
    o.set('ulthit'); o.vx = 0; o.vy = 0; o.y = FLOOR; o.pullTo = null;
    if (f.y < FLOOR) { f.y = FLOOR; f.vy = 0; }
    for (const e of this.fx) if (e.isProjectile) e.dead = true;
    AudioSys.sfx('super');
    Announcer.clear(); if (Settings.voice) Announcer.speak(def.name);
  }
  updateCine() {
    const k = this.cine, def = k.def, f = k.caster, o = k.target;
    k.t++;
    if (def.update) def.update(k.t, k, this);
    if (k.t === 42) Announcer.say(def.quote, { size: 46, color: '#fff', dur: 120, y: H * 0.82 });
    if (def.hits.includes(k.t)) {
      const last = k.t === def.hits[def.hits.length - 1];
      o.hp = Math.max(this.training ? 1 : 0, o.hp - k.per); if (!last && o.hp <= 0) o.hp = 1;
      f.stats.dmg += k.per; f.stats.hits++; f.combo++; f.comboT = 90; f.stats.maxCombo = Math.max(f.stats.maxCombo, f.combo);
      o.flash = 8; this.addShake(last ? 20 : 7);
      sparks(this, o.x, o.y - 150, pick(['#ffd23f', '#ff5a8a', '#7fd6ff']), 14);
      this.fx.push(new ComicBurst(o.x + rand(-60, 60), o.y - rand(150, 260), pick(HIT_WORDS), pick(['#ffd23f', '#ff5a8a', '#3bb3ff', '#7cf28b']), last ? 1.5 : 0.9));
      AudioSys.sfx(last ? 'crit' : 'hitH');
    }
    if (k.t === def.dur - 50) {
      Announcer.say(def.final, { size: 104, color: '#ff3b3b', dur: 80 });
      confetti(this, o.x, o.y - 400, 70); AudioSys.sfx('cheer');
    }
    f.updatePose(); o.updatePose();
    if (k.t >= def.dur) {
      o.spin = 0; this.cine = null;
      f.set('idle');
      if (o.hp <= 0 && !this.training) { o.set('air'); this.ko(f, o, true); o.vy = -12; o.vx = (o.x > f.x ? 1 : -1) * 9; o.y -= 2; o.state = 'air'; }
      else { o.set('air'); o.vy = -9; o.vx = (o.x > f.x ? 1 : -1) * 6; o.y -= 2; }
    }
  }

  // ---------- pause ----------
  pauseItems() {
    const items = ['RESUME', 'MOVE LIST'];
    if (this.training) items.push('DUMMY: ' + this.ctrl[1].ai.mode.toUpperCase());
    items.push('RESTART', 'QUIT TO MENU');
    return items;
  }
  updatePause() {
    if (this.showMoves) { if (Input.menu('back') || Input.menu('ok') || Input.mouse) { this.showMoves = false; AudioSys.sfx('back'); } return; }
    const items = this.pauseItems();
    const sel = menuNav(items.length, this.pauseSel, (i) => ({ x: W / 2 - 200, y: 250 + i * 70, w: 400, h: 58 }));
    this.pauseSel = sel.i;
    if (Input.menu('back')) { this.paused = false; return; }
    if (sel.ok) {
      const it = items[sel.i]; AudioSys.sfx('confirm');
      if (it === 'RESUME') this.paused = false;
      else if (it === 'MOVE LIST') this.showMoves = true;
      else if (it.startsWith('DUMMY')) { const m = ['stand', 'block', 'cpu']; const ai = this.ctrl[1].ai; ai.mode = m[(m.indexOf(ai.mode) + 1) % 3]; }
      else if (it === 'RESTART') App.restartMatch();
      else if (it === 'QUIT TO MENU') App.go('menu');
    }
  }

  // ---------- rendering ----------
  draw(c) {
    const cam = this.cam;
    const sx = cam.shake ? rand(-cam.shake, cam.shake) : 0, sy = cam.shake ? rand(-cam.shake, cam.shake) : 0;
    c.save();
    c.translate(W / 2 + sx, 640 + sy); c.scale(cam.zoom, cam.zoom); c.translate(-cam.x, -FLOOR);
    this.arena.draw(c, cam, this.frame);
    if (this.cine || (this.camPunch && this.camPunch.t > 0)) {
      const a = this.cine ? Math.min(0.6, this.cine.t / 20 * 0.6) * (this.cine.t > this.cine.def.dur - 15 ? (this.cine.def.dur - this.cine.t) / 15 : 1) : this.camPunch.t / 16 * 0.3;
      c.fillStyle = `rgba(5,8,25,${a})`; c.fillRect(-600, -600, STAGE_W + 1200, 1600);
    }
    if (this.cine && this.cine.def.drawWorld) this.cine.def.drawWorld(c, this.cine.t, this.cine, this);
    for (const e of this.fx) if (e.layer === 'back') e.draw(c);
    const [a, b] = this.fighters;
    const order = (a.state === 'attack' || a.state === 'cast' || a.state === 'ult') ? [b, a] : [a, b];
    for (const f of order) f.draw(c);
    for (const e of this.fx) if (e.layer !== 'back') e.draw(c);
    c.restore();

    if (this.cine) this.drawCineOverlay(c);
    this.drawHUD(c);
    this.popups.forEach((p, i) => p.draw(c, i));
    Announcer.draw(c);
    if (this.paused) this.drawPause(c);
  }

  drawCineOverlay(c) {
    const k = this.cine, f = k.caster;
    if (k.def.drawScreen) k.def.drawScreen(c, k.t, k, this);
    if (k.t < 50) {
      // super cut-in band
      const p = k.t < 10 ? easeOutBack(k.t / 10) : k.t > 40 ? 1 - (k.t - 40) / 10 : 1;
      c.save(); c.globalAlpha = Math.max(0, p);
      c.translate(0, H * 0.5);
      c.fillStyle = f.def.color; c.beginPath(); c.moveTo(0, -110); c.lineTo(W, -150); c.lineTo(W, 90); c.lineTo(0, 130); c.fill();
      c.fillStyle = 'rgba(0,0,0,.35)'; for (let i = 0; i < 30; i++) c.fillRect(((i * 97 + k.t * 40) % (W + 200)) - 100, -150 + (i * 37) % 240, 120, 3);
      c.save(); c.beginPath(); c.moveTo(0, -110); c.lineTo(W, -150); c.lineTo(W, 90); c.lineTo(0, 130); c.clip();
      const bx = f.side === 0 ? 260 + (1 - p) * -300 : W - 260 + (1 - p) * 300;
      if (!drawShowcase(c, f.def.id, bx - 210, -165, 420, 300, { fy: 0.22, border: false, radius: 0, flip: f.side === 1 }))
        drawBust(c, f.L, bx, -40, 3.4, 'shout', k.t, f.side === 0 ? 1 : -1);
      c.restore();
      bigText(c, k.def.name, f.side === 0 ? W * 0.66 : W * 0.34, 0, 66, '#fff', INK);
      bigText(c, 'ULTIMATE', f.side === 0 ? W * 0.66 : W * 0.34, -70, 30, '#ffd23f', INK);
      c.restore();
    }
  }

  drawHUD(c) {
    const [a, b] = this.fighters;
    // timer
    c.save();
    rr(c, W / 2 - 52, 18, 104, 82, 14); c.fillStyle = 'rgba(10,20,50,.85)'; c.fill(); c.strokeStyle = '#ffd23f'; c.lineWidth = 3; c.stroke();
    const tsec = this.training || !Settings.roundTime ? '∞' : String(Math.max(0, Math.ceil(this.timer / 60)));
    bigText(c, tsec, W / 2, 56, 50, this.timer < 600 && !this.training ? '#ff3b3b' : '#fff');
    c.fillStyle = '#9fd0ff'; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText(this.training ? 'TRAINING' : `ROUND ${this.round}`, W / 2, 92);
    c.restore();
    this.drawBar(c, a, 0); this.drawBar(c, b, 1);
    // combo counters
    for (const f of this.fighters) {
      if (f.combo >= 2 && f.comboT > 0) {
        const x = f.side === 0 ? 150 : W - 150;
        c.save(); c.globalAlpha = Math.min(1, f.comboT / 20); c.translate(x, 300); c.rotate(f.side ? 0.08 : -0.08);
        bigText(c, `${f.combo} HITS`, 0, 0, 54, '#ffd23f'); bigText(c, f.combo >= 8 ? 'CODE BLUE COMBO!' : f.combo >= 5 ? 'RAPID RESPONSE!' : 'COMBO!', 0, 40, 24, '#fff');
        c.restore();
      }
    }
    // special name banner
    if (this.banner) {
      const bn = this.banner; const p = Math.min(1, bn.t / 8) * (bn.t > 55 ? (70 - bn.t) / 15 : 1);
      c.save(); c.globalAlpha = Math.max(0, p);
      const x = bn.side === 0 ? 40 : W - 40;
      c.font = font(28); const w = c.measureText(bn.text).width + 40;
      rr(c, bn.side === 0 ? x : x - w, 150, w, 42, 8); c.fillStyle = 'rgba(10,20,50,.85)'; c.fill();
      bigText(c, bn.text, bn.side === 0 ? x + 20 : x - 20, 172, 28, this.fighters[bn.side].def.color, INK, bn.side === 0 ? 'left' : 'right');
      c.restore();
    }
    if (this.training) {
      c.save(); c.fillStyle = 'rgba(10,20,50,.7)'; rr(c, W / 2 - 330, H - 46, 660, 34, 8); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 14px sans-serif'; c.textAlign = 'center';
      c.fillText(`Dummy: ${this.ctrl[1].ai.mode.toUpperCase()}  •  Infinite energy  •  Esc/P → pause menu (change dummy, move list)`, W / 2, H - 24); c.restore();
    }
    if (Touch.enabled() && this.phase !== 'end') Touch.draw(c);
  }

  drawBar(c, f, side) {
    const x0 = side === 0 ? 30 : W - 30, dir = side === 0 ? 1 : -1;
    const bw = 470, bx = side === 0 ? 130 : W - 130 - bw, by = 30;
    // portrait
    c.save();
    c.beginPath(); c.arc(x0 + dir * 50, 66, 48, 0, TAU); c.fillStyle = f.def.color; c.fill(); c.lineWidth = 4; c.strokeStyle = '#fff'; c.stroke();
    c.save(); c.beginPath(); c.arc(x0 + dir * 50, 66, 46, 0, TAU); c.clip();
    drawBust(c, f.L, x0 + dir * 50, 40, 1.45, f.hp < f.maxHp * 0.25 ? 'hurt' : 'normal', this.frame, side === 0 ? 1 : -1);
    c.restore(); c.restore();
    // health bar
    c.save();
    rr(c, bx - 4, by - 4, bw + 8, 38, 10); c.fillStyle = 'rgba(10,20,50,.85)'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
    const pct = f.hp / f.maxHp, dpct = f.dispHp / f.maxHp;
    const fill = (p, col) => { const w = bw * p; c.fillStyle = col; rr(c, side === 0 ? bx + bw - w : bx, by, w, 30, 7); c.fill(); };
    fill(dpct, '#ff3b3b');
    const col = pct > 0.5 ? '#3dff6e' : pct > 0.22 ? '#ffd23f' : (this.frame % 20 < 10 ? '#ff3b3b' : '#ff8a8a');
    fill(pct, col);
    c.fillStyle = 'rgba(255,255,255,.3)'; c.fillRect(bx, by + 3, bw, 6);
    // name
    bigText(c, f.def.name, side === 0 ? bx + 6 : bx + bw - 6, by + 52, 26, '#fff', INK, side === 0 ? 'left' : 'right');
    c.fillStyle = '#d6e6ff'; c.font = 'bold 12px sans-serif'; c.textAlign = side === 0 ? 'left' : 'right';
    c.fillText(f.def.role.toUpperCase(), side === 0 ? bx + 8 : bx + bw - 8, by + 76);
    // round wins (crosses)
    for (let i = 0; i < 2; i++) {
      const cx = side === 0 ? bx + bw - 14 - i * 30 : bx + 14 + i * 30, cy = by + 52;
      c.fillStyle = this.wins[side] > i ? '#ff3b3b' : 'rgba(255,255,255,.25)'; c.strokeStyle = INK; c.lineWidth = 2;
      c.fillRect(cx - 4, cy - 11, 8, 22); c.fillRect(cx - 11, cy - 4, 22, 8);
    }
    // energy bar
    const ew = 300, ex = side === 0 ? 30 : W - 30 - ew, ey = H - 70;
    rr(c, ex - 3, ey - 3, ew + 6, 24, 8); c.fillStyle = 'rgba(10,20,50,.85)'; c.fill();
    const full = f.energy >= 100;
    const eg = c.createLinearGradient(ex, 0, ex + ew, 0); eg.addColorStop(0, '#1f5fd1'); eg.addColorStop(1, full ? '#ffd23f' : '#7fd6ff');
    c.fillStyle = eg; const w = ew * f.energy / 100; rr(c, side === 0 ? ex : ex + ew - w, ey, w, 18, 6); c.fill();
    if (full) { c.save(); c.globalAlpha = 0.5 + Math.sin(this.frame * 0.2) * 0.4; c.strokeStyle = '#ffd23f'; c.lineWidth = 3; rr(c, ex - 3, ey - 3, ew + 6, 24, 8); c.stroke(); c.restore(); }
    bigText(c, full ? 'ULTIMATE READY!' : 'ENERGY', side === 0 ? ex + 6 : ex + ew - 6, ey - 14, 18, full ? '#ffd23f' : '#9fd0ff', INK, side === 0 ? 'left' : 'right');
    // special cooldown pips
    f.def.specials.forEach((s, i) => {
      const px = side === 0 ? ex + ew + 16 + i * 40 : ex - 16 - 34 - i * 40, py = ey - 10;
      const cd = f.cd[s.name] || 0, maxCd = s.cd * (this.training ? 0.35 : 1);
      rr(c, px, py, 34, 34, 7); c.fillStyle = cd > 0 ? 'rgba(40,40,60,.85)' : f.def.color; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
      if (cd > 0) { c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(px, py + 34 * (1 - cd / maxCd), 34, 34 * cd / maxCd); }
      c.fillStyle = cd > 0 ? '#aaa' : INK; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText({ N: 'SP', F: '→SP', B: '←SP', D: '↓SP', AIR: 'AIR' }[s.input], px + 17, py + 21);
    });
    c.restore();
  }

  drawPause(c) {
    c.save(); c.fillStyle = 'rgba(5,10,30,.9)'; c.fillRect(0, 0, W, H);
    if (this.showMoves) { drawMoveList(c, this.fighters[0].def, W / 2, 80); bigText(c, 'Press any button to return', W / 2, H - 40, 24, '#9fd0ff'); c.restore(); return; }
    bigText(c, 'PAUSED', W / 2, 150, 90, '#ffd23f');
    c.fillStyle = '#9fd0ff'; c.font = 'bold 16px sans-serif'; c.textAlign = 'center'; c.fillText('ON BREAK (15 minutes, unpaid)', W / 2, 205);
    this.pauseItems().forEach((it, i) => drawButton(c, W / 2 - 200, 250 + i * 70, 400, 58, it, i === this.pauseSel));
    c.restore();
  }
}

function drawMoveList(c, def, cx, y) {
  bigText(c, `${def.name} — MOVE LIST`, cx, y, 50, def.color);
  const rows = [
    ['Light Punch / Heavy Punch', 'J / K'], ['Light Kick / Heavy Kick', 'U / I'], ['Block (hold)', 'S'], ['Dodge roll', 'S + ← or →'], ['Jump (air attacks!)', 'W'],

    [`ULTIMATE: ${def.ult.name}`, 'O  (full energy)']

  c.save();
  rows.forEach((r, i) => {
    const yy = y + 60 + i * 40;
    rr(c, cx - 420, yy - 16, 840, 34, 8); c.fillStyle = i >= 5 ? 'rgba(31,95,209,.35)' : 'rgba(255,255,255,.08)'; c.fill();
    c.fillStyle = i === rows.length - 1 ? '#ffd23f' : '#fff'; c.font = 'bold 18px sans-serif'; c.textAlign = 'left'; c.fillText(r[0], cx - 400, yy + 7);
    c.fillStyle = '#7fd6ff'; c.textAlign = 'right'; c.fillText(r[1], cx + 400, yy + 7);
  });
  c.restore();
}

'use strict';
// ============================================================
// App: scenes (title, menus, select, VS, fight, results), touch controls, main loop
// ============================================================

// ---------- UI helpers ----------
function drawButton(c, x, y, w, h, label, sel, sub) {
  c.save();
  const pulse = sel ? Math.sin(App.t * 0.15) * 3 : 0;
  rr(c, x - pulse, y - pulse / 2, w + pulse * 2, h + pulse, 12);
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, sel ? '#ffd23f' : 'rgba(30,60,130,.9)'); g.addColorStop(1, sel ? '#ff9f1c' : 'rgba(15,30,80,.9)');
  c.fillStyle = g; c.fill(); c.strokeStyle = sel ? '#fff' : '#5f8fe0'; c.lineWidth = 3; c.stroke();
  bigText(c, label, x + w / 2, y + h / 2 + (sub ? -8 : 1), Math.min(34, h * 0.55), sel ? '#13284f' : '#fff', sel ? '#fff' : INK);
  if (sub) { c.fillStyle = sel ? '#13284f' : '#bcd3ff'; c.font = 'bold 13px sans-serif'; c.textAlign = 'center'; c.fillText(sub, x + w / 2, y + h - 10); }
  c.restore();
}
function menuNav(n, i, rectFn, horizontal = false) {
  let ok = false;
  if (Input.menu(horizontal ? 'left' : 'up')) { i = (i - 1 + n) % n; AudioSys.sfx('select'); }
  if (Input.menu(horizontal ? 'right' : 'down')) { i = (i + 1) % n; AudioSys.sfx('select'); }
  if (Input.menu('ok')) ok = true;
  if (Input.mouse) {
    for (let k = 0; k < n; k++) { const r = rectFn(k); if (Input.mouse.x >= r.x && Input.mouse.x <= r.x + r.w && Input.mouse.y >= r.y && Input.mouse.y <= r.y + r.h) { if (k === i) ok = true; else { i = k; ok = true; } } }
  }
  return { i, ok };
}
function tapped(r) { const m = Input.mouse; return m && m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h; }
function backBtn(c) { drawButton(c, 24, H - 76, 150, 52, '◀ BACK', false); }
function backTapped() { return tapped({ x: 24, y: H - 76, w: 150, h: 52 }); }
function ratingStars(c, x, y, n, col = '#ffd23f') { for (let i = 0; i < 5; i++) star(c, x + i * 22, y, 9, i < n ? col : 'rgba(255,255,255,.2)'); }
function bgGrad(c, a = '#0b1a45', b = '#1f5fd1') {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(1, b); c.fillStyle = g; c.fillRect(0, 0, W, H);
  // ECG line
  c.save(); c.strokeStyle = 'rgba(127,214,255,.25)'; c.lineWidth = 4; c.beginPath();
  for (let x = 0; x <= W; x += 6) { const ph = (x + App.t * 6) % 300; const y = ph > 140 && ph < 170 ? -90 * Math.sin((ph - 140) / 30 * Math.PI) * (ph < 155 ? 1 : -0.4) : 0; x ? c.lineTo(x, H * 0.55 + y) : c.moveTo(x, H * 0.55 + y); }
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,.04)'; for (let i = 0; i < 12; i++) { c.save(); c.translate((i * 173 + App.t * 0.5) % (W + 100) - 50, (i * 97) % H); c.rotate(App.t * 0.01 + i); c.fillRect(-12, -40, 24, 80); c.fillRect(-40, -12, 80, 24); c.restore(); }
  c.restore();
}
function logo(c, x, y, s = 1) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.save(); c.rotate(-0.04);
  bigText(c, 'CODE BLUE', 0, 0, 150, '#7fd6ff', '#0b1530');
  c.globalAlpha = 0.25 + Math.sin(App.t * 0.1) * 0.15; bigText(c, 'CODE BLUE', 0, 0, 150, '#fff', 'rgba(0,0,0,0)'); c.globalAlpha = 1;
  c.restore();
  rr(c, -300, 64, 600, 56, 10); c.fillStyle = '#d0121b'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 4; c.stroke();
  bigText(c, 'HEALTHCARE SHOWDOWN', 0, 93, 46, '#fff', '#5a0a0f');
  c.restore();
}
function lineup(c, y, scale, t, highlight = -1) {
  ROSTER.forEach((r, i) => {
    const x = W / 2 + (i - 2) * 230;
    const b = Math.sin(t * 0.09 + i) * 0.06;
    const pose = Object.assign({}, i === highlight ? POSES.win : POSES.idle, { fK: POSES.idle.fK + b * 2, bK: POSES.idle.bK + b * 2 });
    drawCharacter(c, r.look, x, y, { pose, facing: i < 2 ? 1 : i > 2 ? -1 : 1, t, scale, expr: i === highlight ? 'happy' : 'normal', blink: (t + i * 50) % 220 < 6 });
  });
}

const App = {
  scene: 'title', t: 0, st: 0, touchSeen: false, fx: [],
  sel: null, match: null, arcade: null, lastMatchOpts: null, result: null,
  go(scene) {
    this.scene = scene; this.st = 0; this.fx = []; Announcer.clear();
    if (['menu', 'title', 'instructions', 'settings', 'select', 'arena'].includes(scene)) AudioSys.playMusic('menu');
    if (scene !== 'fight') this.match = null;
  },
  startSelect(mode) {
    this.mode = mode;
    this.sel = { step: 0, cur: [0, 1], chosen: [null, null], arena: 0 };
    this.go('select');
  },
  beginMatch(p1, p2, arena) {
    const opts = { p1, p2, arena, mode: this.mode, onEnd: res => this.onMatchEnd(res) };
    this.lastMatchOpts = opts;
    this.vs = { p1, p2, arena }; this.go('vs');
  },
  restartMatch() { this.match = new Match(this.lastMatchOpts); this.scene = 'fight'; this.st = 0; },
  onMatchEnd(res) {
    this.result = res; this.resultSel = 0;
    this.later = 140; // linger on the arena briefly before results
  },
  nextArcade() {
    const a = this.arcade;
    this.beginMatch(this.sel.chosen[0], a.ladder[a.idx], a.arenas[a.idx]);
  },

  update() {
    this.t++; this.st++;
    const s = this.scene;
    this.fx = this.fx.filter(e => e.update());
    if (s === 'title') {
      if (this.st === 2) AudioSys.playMusic('menu');
      if (Input.menu('ok') || Input.mouse || Input.pressedKeys.size || Input.padMenu.ok || Input.padMenu.start) { AudioSys.unlock(); AudioSys.playMusic('menu'); AudioSys.sfx('confirm'); this.go('menu'); this.menuSel = 0; Announcer.say('CODE BLUE!', { size: 110, color: '#7fd6ff', dur: 70 }); }
      return;
    }
    if (s === 'menu') {
      const items = MAIN_MENU;
      const r = menuNav(items.length, this.menuSel || 0, i => ({ x: 70, y: 200 + i * 66, w: 420, h: 56 }));
      this.menuSel = r.i;
      if (r.ok) { AudioSys.sfx('confirm'); items[r.i].go(); }
      if (Input.menu('back')) this.go('title');
      return;
    }
    if (s === 'instructions') { if (Input.menu('back') || Input.menu('ok') || backTapped()) { AudioSys.sfx('back'); this.go('menu'); } return; }
    if (s === 'settings') return updateSettings();
    if (s === 'select') return updateSelect();
    if (s === 'arena') return updateArenaSelect();
    if (s === 'vs') {
      if (this.st === 8) { Announcer.say('CODE BLUE!', { size: 110, color: '#7fd6ff', dur: 70, y: H - 110, speak: 'Code blue! ' + this.vs.p1.name.toLowerCase() + ' versus ' + this.vs.p2.name.toLowerCase() }); AudioSys.sfx('alarm'); }
      if (this.st > 230 || (this.st > 40 && (Input.menu('ok') || Input.mouse))) { this.match = new Match(Object.assign({}, this.lastMatchOpts)); this.scene = 'fight'; this.st = 0; Announcer.clear(); }
      return;
    }
    if (s === 'fight') {
      this.match.update();
      if (this.later != null && --this.later <= 0) { this.later = null; this.go('result'); this.scene = 'result'; }
      return;
    }
    if (s === 'result') return updateResult();
    if (s === 'ending') {
      if (this.st % 40 === 1) confetti({ fx: this.fx }, W / 2, 200, 40);
      if (this.st > 90 && (Input.menu('ok') || Input.mouse)) { AudioSys.sfx('confirm'); this.go('menu'); }
      return;
    }
  },

  draw(c) {
    const s = this.scene;
    if (s === 'title') drawTitle(c);
    else if (s === 'menu') drawMenu(c);
    else if (s === 'instructions') drawInstructions(c);
    else if (s === 'settings') drawSettings(c);
    else if (s === 'select') drawSelect(c);
    else if (s === 'arena') drawArenaSelect(c);
    else if (s === 'vs') drawVS(c);
    else if (s === 'fight') this.match.draw(c);
    else if (s === 'result') drawResult(c);
    else if (s === 'ending') drawEnding(c);
    if (s !== 'fight') { for (const e of this.fx) e.draw(c); Announcer.draw(c); }
  }
};

}
function drawArenaSelect(c) {
  bgGrad(c, '#0b1a45', '#13284f');
  bigText(c, 'CHOOSE YOUR WORKPLACE', W / 2, 50, 54, '#ffd23f');
  ARENAS.forEach((a, i) => drawButton(c, arenaRect(i).x, arenaRect(i).y, arenaRect(i).w, arenaRect(i).h, a.name, i === App.arenaSel, `Stage ${i + 1}`));
  drawArenaPreview(c, App.arenaSel, 510, 110, 720, 405, App.t);
  c.strokeStyle = '#fff'; c.lineWidth = 4; rr(c, 510, 110, 720, 405, 12); c.stroke();
  const [p1, p2] = App.sel.chosen;
  if (p1 && p2) { drawBust(c, p1.look, 600, 560, 1.6, 'fierce', App.t, 1); drawBust(c, p2.look, 1140, 560, 1.6, 'fierce', App.t, -1); bigText(c, `${p1.name}  VS  ${p2.name}`, 870, 610, 40, '#fff'); }
  backBtn(c);
}

// ---------- VS screen ----------
function drawVS(c) {
  const { p1, p2, arena } = App.vs; const t = App.st;
  c.fillStyle = p1.color; c.beginPath(); c.moveTo(0, 0); c.lineTo(W * 0.56, 0); c.lineTo(W * 0.44, H); c.lineTo(0, H); c.fill();
  c.fillStyle = p2.color; c.beginPath(); c.moveTo(W * 0.56, 0); c.lineTo(W, 0); c.lineTo(W, H); c.lineTo(W * 0.44, H); c.fill();
  c.fillStyle = 'rgba(5,10,30,.45)'; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 24; i++) { c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(((i * 211 + t * 30) % (W + 300)) - 150, (i * 53) % H, 200, 4); }
  const sl = Math.min(1, t / 25);
  const es = easeOutBack(sl);
  if (!drawShowcase(c, p1.id, lerp(-450, 90, es), 168, 400, 530, { fy: 0.4, glow: p1.color }))
    drawCharacter(c, p1.look, lerp(-300, 300, es), 690, { pose: POSES.armsx, facing: 1, t, scale: 1.7, expr: 'fierce', spriteKey: 'idle' });
  if (!drawShowcase(c, p2.id, lerp(W + 50, W - 490, es), 168, 400, 530, { fy: 0.4, glow: p2.color, flip: true }))
    drawCharacter(c, p2.look, lerp(W + 300, W - 300, es), 690, { pose: POSES.armsx, facing: -1, t, scale: 1.7, expr: 'fierce', spriteKey: 'idle' });
  const vs = 1 + Math.sin(t * 0.2) * 0.06;
  c.save(); c.translate(W / 2, H / 2 - 40); c.scale(vs, vs); burst(c, 110, 14, '#ffd23f'); bigText(c, 'VS', 0, 4, 130, '#d0121b', '#fff'); c.restore();
  if (t > 20) {
    bigText(c, p1.name, 40, 60, 60, '#fff', INK, 'left'); bigText(c, p1.title, 40, 110, 26, '#ffd23f', INK, 'left');
    bigText(c, p2.name, W - 40, 60, 60, '#fff', INK, 'right'); bigText(c, p2.title, W - 40, 110, 26, '#ffd23f', INK, 'right');
    c.fillStyle = '#fff'; c.font = 'italic bold 17px sans-serif'; c.textAlign = 'left'; c.fillText(`"${p1.intro}"`, 40, 146);
    c.textAlign = 'right'; c.fillText(`"${p2.intro}"`, W - 40, 146);
  }
  rr(c, W / 2 - 260, H - 60, 520, 44, 10); c.fillStyle = 'rgba(5,10,30,.8)'; c.fill();
  bigText(c, `📍 ${ARENAS[arena].name}`, W / 2, H - 38, 26, '#7fd6ff');
  if (App.mode === 'arcade') bigText(c, `PATIENT ${App.arcade.idx + 1} OF ${App.arcade.ladder.length}${App.arcade.idx === App.arcade.ladder.length - 1 ? ' — FINAL BOSS' : ''}`, W / 2, 180, 30, '#fff');
}

// ---------- Results ----------
function resultOptions() {
  const res = App.result;
  if (App.mode === 'arcade') return res.winner === 0 ? [App.arcade.idx >= App.arcade.ladder.length - 1 ? 'FINISH SHIFT' : 'NEXT PATIENT', 'MAIN MENU'] : ['CONTINUE', 'MAIN MENU'];
  return ['REMATCH', 'CHARACTER SELECT', 'MAIN MENU'];
}
function updateResult() {
  if (App.st === 1) { const w = App.result.fighters[App.result.winner]; App.quote = pick(w.def.win); if (Settings.voice) Announcer.speak(App.quote); confetti({ fx: App.fx }, 300, 200, 60); }
  if (App.st < 40) return;
  const opts = resultOptions();
  const r = menuNav(opts.length, App.resultSel, i => ({ x: 720 + i * 0, y: 560 + i * 0, w: 0, h: 0 }), true);
  // horizontal buttons
  let ok = r.ok; App.resultSel = r.i;
  if (Input.mouse) opts.forEach((o, i) => { if (tapped(resultBtnRect(i, opts.length))) { App.resultSel = i; ok = true; } });
  if (!ok) return;
  const o = opts[App.resultSel]; AudioSys.sfx('confirm');
  if (o === 'NEXT PATIENT') { App.arcade.idx++; App.nextArcade(); }
  else if (o === 'FINISH SHIFT') { App.go('ending'); AudioSys.playMusic('win'); Announcer.say('SHIFT COMPLETE!', { size: 110, color: '#7cf28b', dur: 150 }); }
  else if (o === 'CONTINUE') App.nextArcade();
  else if (o === 'REMATCH') { App.beginMatch(App.lastMatchOpts.p1, App.lastMatchOpts.p2, App.lastMatchOpts.arena); }
  else if (o === 'CHARACTER SELECT') App.startSelect(App.mode);
  else App.go('menu');
}
function resultBtnRect(i, n) { const w = 300, gap = 20, x0 = W / 2 - (n * w + (n - 1) * gap) / 2; return { x: x0 + i * (w + gap), y: H - 86, w, h: 62 }; }
function drawResult(c) {
  const res = App.result; const w = res.fighters[res.winner], l = res.fighters[1 - res.winner];
  bgGrad(c, '#0b1a45', w.def.color);
  c.fillStyle = 'rgba(5,10,30,.35)'; c.fillRect(0, 0, W, H);
  const humanWon = res.winner === 0 || App.mode === 'versus';
  bigText(c, App.mode === 'versus' ? `PLAYER ${res.winner + 1} WINS!` : humanWon ? 'SHIFT COMPLETE!' : 'YOU\'VE BEEN DISCHARGED…', W / 2, 54, 70, humanWon ? '#ffd23f' : '#ff3b3b');
  if (!drawShowcase(c, w.def.id, 70, 155, 360, 300, { fy: 0.3, glow: w.def.color }))
    drawCharacter(c, w.L, 250, 600, { pose: w.winPose(), facing: 1, t: App.t, scale: 1.45, expr: 'happy', spriteKey: 'win' });
  c.save(); c.globalAlpha = 0.85; drawCharacter(c, l.L, 1150, 600, { pose: POSES.lose, facing: -1, t: App.t, scale: 1.0, expr: 'hurt', spriteKey: 'lose' }); c.restore();
  bigText(c, w.def.name, 250, 130, 50, w.def.color);
  rr(c, 80, 470, 340, 70, 12); c.fillStyle = 'rgba(255,255,255,.95)'; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  c.fillStyle = '#13284f'; c.font = 'italic bold 17px sans-serif'; c.textAlign = 'center'; wrapText(c, `"${App.quote || ''}"`, 250, 505, 310, 20);
  // stats table
  const tx = 470, ty = 110;
  rr(c, tx, ty, 560, 410, 14); c.fillStyle = 'rgba(5,10,30,.7)'; c.fill(); c.strokeStyle = '#5f8fe0'; c.lineWidth = 2; c.stroke();
  bigText(c, 'END-OF-SHIFT REPORT', tx + 280, ty + 32, 32, '#7fd6ff');
  const [a, b] = res.fighters;
  bigText(c, a.def.name, tx + 330, ty + 72, 22, a.def.color); bigText(c, b.def.name, tx + 470, ty + 72, 22, b.def.color);
  const acc = f => f.stats.attacks ? Math.round(f.stats.hits / Math.max(f.stats.hits, f.stats.attacks + f.stats.specials) * 100) + '%' : '—';
  const rows = [['Damage dealt', f => f.stats.dmg], ['Hits landed', f => f.stats.hits], ['Accuracy', acc], ['Max combo', f => f.stats.maxCombo], ['Specials used', f => f.stats.specials], ['Ultimates', f => f.stats.ults], ['Blocks', f => f.stats.blocks], ['Rounds won', f => res.match.wins[f.side]]];
  rows.forEach((r, i) => {
    const y = ty + 110 + i * 36;
    if (i % 2 === 0) { c.fillStyle = 'rgba(255,255,255,.05)'; c.fillRect(tx + 10, y - 20, 540, 34); }
    c.fillStyle = '#fff'; c.font = 'bold 17px sans-serif'; c.textAlign = 'left'; c.fillText(r[0], tx + 24, y + 2);
    c.textAlign = 'center'; c.fillStyle = '#ffd23f'; c.fillText(String(r[1](a)), tx + 330, y + 2); c.fillText(String(r[1](b)), tx + 470, y + 2);
  });
  c.fillStyle = '#bcd3ff'; c.font = 'bold 14px sans-serif'; c.textAlign = 'center'; c.fillText(`Shift length: ${(res.time / 60).toFixed(1)}s of actual fighting (plus 3 hrs of charting)`, tx + 280, ty + 400);
  const opts = resultOptions();
  if (App.st > 40) opts.forEach((o, i) => { const R = resultBtnRect(i, opts.length); drawButton(c, R.x, R.y, R.w, R.h, o, i === App.resultSel); });
}
function drawEnding(c) {
  bgGrad(c, '#0b1a45', '#2c8a5a');
  const p = App.sel.chosen[0];
  if (!drawShowcase(c, p.id, W / 2 - 170, 280, 340, 380, { fy: 0.35, glow: p.color }))
    drawCharacter(c, p.look, W / 2, 640, { pose: POSES.win, facing: 1, t: App.t, scale: 1.6, expr: 'happy', spriteKey: 'win' });
  bigText(c, 'SHIFT COMPLETE!', W / 2, 80, 96, '#ffd23f');
  bigText(c, `${p.name} SURVIVED THE HEALTHCARE SHOWDOWN!`, W / 2, 160, 36, '#fff');
  c.fillStyle = '#fff'; c.font = 'bold 18px sans-serif'; c.textAlign = 'center';
  ['All charts closed. All prior auths… still pending.', 'The Boardroom has approved your PTO request (effective 2031).', 'Thank you to every nurse, NP, MA, phlebotomist — and yes, even admin.'].forEach((l, i) => c.fillText(l, W / 2, 205 + i * 26));
  if (App.st > 90 && App.t % 60 < 40) bigText(c, 'PRESS ENTER / TAP TO CLOCK OUT', W / 2, H - 30, 30, '#7fd6ff');
}

// ---------- Main loop & sizing ----------
let renderScale = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  canvas.style.width = Math.floor(W * s) + 'px'; canvas.style.height = Math.floor(H * s) + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  renderScale = Math.max(0.5, Math.min(2, s * dpr));
  canvas.width = Math.round(W * renderScale); canvas.height = Math.round(H * renderScale);
}
addEventListener('resize', resize); resize();

let lastTime = performance.now(), acc = 0;
const STEP = 1000 / FPS;
function frame(now) {
  acc += Math.min(100, now - lastTime); lastTime = now;
  let steps = 0;
  while (acc >= STEP && steps < 5) {
    Input.pollPads();
    try { App.update(); } catch (e) { console.error(e); }
    Announcer.update();
    Input.endFrame();
    acc -= STEP; steps++;
  }
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  try { App.draw(ctx); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
loadPortraitImages(ROSTER.map(r => r.id));
if (window.speechSynthesis) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {} }
requestAnimationFrame(frame);
// test hook
window.__codeblue = { App, Match, ROSTER, ARENAS, Settings };

</script>
