<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Code Blue Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap">
<style>
  :root { --bg: #050a1e; --fg: #e8f1ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #050a1e; --fg: #e8f1ff; } }
  :root[data-theme="dark"] { --bg: #050a1e; --fg: #e8f1ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; }

<body>
<canvas id="game" width="1280" height="720" tabindex="0" aria-label="Code Blue: Healthcare Showdown game"></canvas>
<script>
'use strict';
// ============================================================
// CODE BLUE: HEALTHCARE SHOWDOWN — core utilities, settings, input, audio
// ============================================================
const W = 1280, H = 720;
const FLOOR = 640;          // world-space floor line
const STAGE_W = 1800;       // world width
const TAU = Math.PI * 2;
const FPS = 60;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function rr(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
const FONT = "'Bangers', 'Impact', 'Arial Black', sans-serif";
const FONT2 = "'Russo One', 'Arial Black', 'Segoe UI', sans-serif";
function font(size, f = FONT) { return `${size}px ${f}`; }

// Big outlined cartoon text
function bigText(c, text, x, y, size, fill = '#fff', stroke = '#0b1530', align = 'center', f = FONT) {
  c.save();
  c.font = font(size, f);
  c.textAlign = align; c.textBaseline = 'middle';
  c.lineJoin = 'round';
  c.lineWidth = Math.max(3, size / 7);
  c.strokeStyle = stroke;
  c.strokeText(text, x, y);
  c.fillStyle = fill;
  c.fillText(text, x, y);
  c.restore();
}

// ------------------------------------------------------------
// Settings (persisted per viewer when storage is available)
// ------------------------------------------------------------
const DIFFS = ['Easy', 'Normal', 'Hard', 'Nightmare Shift'];
const Settings = {
  difficulty: 1, music: 0.5, sfx: 0.8, voice: true, popups: true, roundTime: 99, touch: 'auto',
  load() {
    try { const s = JSON.parse(localStorage.getItem('codeblue.settings') || '{}'); Object.assign(this, s); } catch (e) { /* storage unavailable */ }
  },
  save() {
    try {
      const { difficulty, music, sfx, voice, popups, roundTime, touch } = this;
      localStorage.setItem('codeblue.settings', JSON.stringify({ difficulty, music, sfx, voice, popups, roundTime, touch }));
    } catch (e) { /* ignore */ }
  }
};
Settings.load();

// ------------------------------------------------------------
// Input: keyboard (two layouts), gamepads, touch
// ------------------------------------------------------------
const BTN = ['left', 'right', 'up', 'down', 'lp', 'hp', 'lk', 'hk', 'sp', 'ult'];
const KEYMAP_P1 = {
  left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],
  lp: ['KeyJ'], hp: ['KeyK'], lk: ['KeyU'], hk: ['KeyI'], sp: ['KeyL'], ult: ['KeyO']
};
const KEYMAP_P2 = {
  left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
  lp: ['Numpad1', 'Comma'], hp: ['Numpad2', 'Period'], lk: ['Numpad4', 'Semicolon'], hk: ['Numpad5', 'Quote'],
  sp: ['Numpad3', 'Slash'], ult: ['Numpad6', 'BracketRight']
};
const Input = {
  keys: new Set(), pressedKeys: new Set(), touch: {}, touchPressed: {},
  pads: [], padPrev: [[], []], anyPressed: false, mouse: null,
  init() {
    addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Slash', 'Quote'].includes(e.code)) e.preventDefault();
      if (!this.keys.has(e.code)) this.pressedKeys.add(e.code);
      this.keys.add(e.code);
      AudioSys.unlock();
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
  },
  down(code) { return this.keys.has(code); },
  pressed(code) { return this.pressedKeys.has(code); },
  // menu-level helpers
  menu(action) {
    const k = this.pressedKeys;
    const pad = this.padMenu;
    switch (action) {
      case 'up': return k.has('KeyW') || k.has('ArrowUp') || pad.up;
      case 'down': return k.has('KeyS') || k.has('ArrowDown') || pad.down;
      case 'left': return k.has('KeyA') || k.has('ArrowLeft') || pad.left;
      case 'right': return k.has('KeyD') || k.has('ArrowRight') || pad.right;
      case 'ok': return k.has('Enter') || k.has('Space') || k.has('KeyJ') || k.has('NumpadEnter') || pad.ok;
      case 'back': return k.has('Escape') || k.has('Backspace') || pad.back;
      case 'pause': return k.has('Escape') || k.has('KeyP') || pad.start;
    }
    return false;
  },
  padMenu: {},
  pollPads() {
    const gp = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
    this.pads = gp;
    this.padMenu = {};
    gp.slice(0, 2).forEach((p, i) => {
      const prev = this.padPrev[i] || [];
      const cur = p.buttons.map(b => b.pressed);
      const ax = p.axes || [];
      cur[100] = (ax[0] || 0) < -0.5; cur[101] = (ax[0] || 0) > 0.5; cur[102] = (ax[1] || 0) < -0.5; cur[103] = (ax[1] || 0) > 0.5;
      const pr = idx => cur[idx] && !prev[idx];
      if (pr(12) || pr(102)) this.padMenu.up = true;
      if (pr(13) || pr(103)) this.padMenu.down = true;
      if (pr(14) || pr(100)) this.padMenu.left = true;
      if (pr(15) || pr(101)) this.padMenu.right = true;
      if (pr(0)) this.padMenu.ok = true;
      if (pr(1)) this.padMenu.back = true;
      if (pr(9)) this.padMenu.start = true;
      this.padPrev[i] = cur;
      p._cur = cur; p._prev = prev;
    });
  },
  // Build a per-player control frame. layouts: array of keymaps; padIndex; useTouch
  read(layouts, padIndex, useTouch) {
    const held = {}, pressed = {};
    for (const b of BTN) {
      held[b] = false; pressed[b] = false;
      for (const map of layouts) for (const code of map[b]) {
        if (this.keys.has(code)) held[b] = true;
        if (this.pressedKeys.has(code)) pressed[b] = true;
      }
      if (useTouch) {
        if (this.touch[b]) held[b] = true;
        if (this.touchPressed[b]) pressed[b] = true;
      }
    }
    const p = this.pads[padIndex];
    if (p && p._cur) {
      const c = p._cur, pv = p._prev;
      const map = { left: [14, 100], right: [15, 101], up: [12, 102, 3 /*Y*/ ], down: [13, 103, 6], lp: [2], hp: [3], lk: [0], hk: [1], sp: [5, 4], ult: [7] };
      // Y used for HP; jump on up/stick only
      map.up = [12, 102];
      for (const b of BTN) for (const i of map[b]) {
        if (c[i]) held[b] = true;
        if (c[i] && !pv[i]) pressed[b] = true;
      }
    }
    return { held, pressed };
  },
  endFrame() { this.pressedKeys.clear(); this.touchPressed = {}; this.mouse = null; }
};
Input.init();

// ------------------------------------------------------------
// Audio: all sound is synthesized with Web Audio (no files needed)
// ------------------------------------------------------------
const AudioSys = {
  ac: null, master: null, musicGain: null, sfxGain: null, noiseBuf: null,
  musicOn: false, track: null, step: 0, nextTime: 0, timer: null,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ac.destination);
      this.musicGain = this.ac.createGain(); this.musicGain.connect(this.master);
      this.sfxGain = this.ac.createGain(); this.sfxGain.connect(this.master);
      this.applyVolumes();
      const len = this.ac.sampleRate * 1.5;
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      if (this.wantTrack) this.playMusic(this.wantTrack);
    } catch (e) { this.ac = null; }
  },
  applyVolumes() {
    if (!this.ac) return;
    this.musicGain.gain.value = Settings.music * 0.35;
    this.sfxGain.gain.value = Settings.sfx * 0.7;
  },
  tone(freq, dur, type = 'square', vol = 0.3, slide = null, delay = 0, dest = null) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.3, freq = 1200, type = 'lowpass', delay = 0, dest = null) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxGain);
    s.start(t, Math.random()); s.stop(t + dur + 0.02);
  },
  sfx(name) {
    if (!this.ac) return;
    const T = this.tone.bind(this), N = this.noise.bind(this);
    switch (name) {
      case 'hitL': N(0.08, 0.5, 2500); T(180, 0.08, 'square', 0.25, 70); break;
      case 'hitH': N(0.18, 0.7, 1400); T(120, 0.2, 'sawtooth', 0.35, 40); T(60, 0.25, 'sine', 0.5, 30); break;
      case 'crit': N(0.3, 0.8, 900); T(90, 0.35, 'sawtooth', 0.4, 30); T(880, 0.25, 'square', 0.15, 1760, 0.05); break;
      case 'block': T(900, 0.06, 'square', 0.15, 600); N(0.05, 0.2, 5000, 'highpass'); break;
      case 'whoosh': N(0.15, 0.25, 900, 'bandpass'); break;
      case 'jump': T(300, 0.12, 'square', 0.12, 600); break;
      case 'land': N(0.06, 0.25, 400); break;
      case 'ding': T(1318, 0.18, 'sine', 0.3); T(1760, 0.35, 'sine', 0.3, null, 0.09); break;
      case 'notify': T(988, 0.1, 'triangle', 0.3); T(1318, 0.1, 'triangle', 0.3, null, 0.1); T(1976, 0.25, 'triangle', 0.3, null, 0.2); break;
      case 'stamp': T(80, 0.3, 'sine', 0.8, 40); N(0.2, 0.7, 600); break;
      case 'beep': T(1000, 0.09, 'sine', 0.25); break;
      case 'alarm': for (let i = 0; i < 4; i++) { T(880, 0.12, 'square', 0.18, null, i * 0.25); T(660, 0.12, 'square', 0.18, null, i * 0.25 + 0.12); } break;
      case 'phone': for (let i = 0; i < 6; i++) T(i % 2 ? 480 : 440, 0.05, 'square', 0.12, null, i * 0.05); break;
      case 'printer': for (let i = 0; i < 8; i++) N(0.04, 0.25, 3000, 'bandpass', i * 0.07); break;
      case 'ko': T(400, 0.9, 'sawtooth', 0.35, 50); N(0.6, 0.5, 700); break;
      case 'select': T(660, 0.05, 'square', 0.15); break;
      case 'confirm': T(523, 0.08, 'square', 0.2); T(784, 0.12, 'square', 0.2, null, 0.08); break;
      case 'back': T(392, 0.1, 'square', 0.15, 262); break;
      case 'magic': for (let i = 0; i < 6; i++) T(600 + i * 180, 0.12, 'triangle', 0.15, null, i * 0.04); break;
      case 'freeze': T(2000, 0.4, 'sine', 0.2, 500); N(0.3, 0.2, 6000, 'highpass'); break;
      case 'pop': T(500, 0.06, 'sine', 0.3, 900); break;
      case 'cash': T(2093, 0.08, 'square', 0.15); T(2637, 0.3, 'square', 0.15, null, 0.08); N(0.1, 0.3, 4000, 'highpass'); break;
      case 'tick': T(2000, 0.03, 'square', 0.12); break;
      case 'snip': N(0.05, 0.5, 6000, 'highpass'); N(0.05, 0.5, 6000, 'highpass', 0.08); break;
      case 'inflate': T(150, 0.6, 'sawtooth', 0.15, 600); break;
      case 'teleport': T(1500, 0.25, 'sine', 0.25, 200); T(200, 0.25, 'sine', 0.25, 1500, 0.1); break;
      case 'super': T(110, 1.2, 'sawtooth', 0.3, 880); N(1.2, 0.3, 800, 'bandpass'); break;
      case 'cheer': N(1.5, 0.35, 2500, 'bandpass'); break;
      case 'slam': T(55, 0.5, 'sine', 0.9, 30); N(0.35, 0.8, 500); break;
    }
  },
  // ---- music: tiny step sequencer ----
  TRACKS: {
    menu:  { bpm: 128, root: 57, scale: [0, 3, 5, 7, 10], bass: [0, 0, 7, 0, 5, 5, 3, 3], lead: [12, -1, 15, 12, 17, -1, 15, 10, 12, -1, 19, 17, 15, -1, 12, -1] },
    fight: { bpm: 150, root: 52, scale: [0, 3, 5, 7, 10], bass: [0, 0, 12, 0, 10, 0, 7, 5], lead: [12, 15, 17, 19, 17, 15, 12, -1, 10, 12, 15, 12, 10, 7, 10, -1] },
    boss:  { bpm: 160, root: 50, scale: [0, 1, 5, 7, 8], bass: [0, 12, 0, 13, 0, 12, 8, 7], lead: [12, -1, 13, 12, 8, -1, 7, 8, 12, 15, 13, 12, 8, 7, 5, -1] },
    win:   { bpm: 140, root: 60, scale: [0, 4, 7, 9, 12], bass: [0, 0, 5, 5, 7, 7, 0, 0], lead: [12, 16, 19, 24, -1, 19, 24, -1, 21, 19, 16, 12, 16, -1, 12, -1] }
  },
  playMusic(name) {
    this.wantTrack = name;
    if (!this.ac) return;
    if (this.track === name && this.timer) return;
    this.stopMusic();
    this.track = name; this.step = 0; this.nextTime = this.ac.currentTime + 0.05;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stopMusic() { if (this.timer) clearInterval(this.timer); this.timer = null; this.track = null; },
  schedule() {
    if (!this.ac || !this.track) return;
    const tr = this.TRACKS[this.track];
    const spb = 60 / tr.bpm / 4;  // 16th notes
    while (this.nextTime < this.ac.currentTime + 0.12) {
      const s = this.step, d = this.nextTime - this.ac.currentTime;
      const mf = n => 440 * Math.pow(2, (n - 69) / 12);
      const bar = Math.floor(s / 16) % 4;
      const shift = [0, 0, 5, 7][bar];
      // drums
      if (s % 4 === 0) { this.tone(140, 0.12, 'sine', 0.6, 40, d, this.musicGain); }
      if (s % 8 === 4) this.noise(0.12, 0.35, 1800, 'bandpass', d, this.musicGain);
      if (s % 2 === 1) this.noise(0.03, 0.12, 8000, 'highpass', d, this.musicGain);
      // bass (8th notes)
      if (s % 2 === 0) {
        const bn = tr.bass[(s / 2) % tr.bass.length];
        this.tone(mf(tr.root - 12 + bn + shift), spb * 1.8, 'sawtooth', 0.16, null, d, this.musicGain);
      }
      // lead
      const ln = tr.lead[s % tr.lead.length];
      if (ln >= 0 && (Math.floor(s / 32) % 2 === 1 || this.track !== 'fight' || s % 4 !== 2)) {
        this.tone(mf(tr.root + ln + shift), spb * 1.6, 'square', 0.07, null, d, this.musicGain);
      }
      this.nextTime += spb; this.step++;
    }
  }
};
['pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, () => AudioSys.unlock(), { passive: true }));

// ------------------------------------------------------------
// Announcer: on-screen callout + optional browser speech
// ------------------------------------------------------------
const Announcer = {
  queue: [], current: null,
  say(text, opts = {}) {
    const a = { text, t: 0, dur: opts.dur || 90, color: opts.color || '#ffd23f', size: opts.size || 96, y: opts.y || H * 0.42, sub: opts.sub || null };
    if (opts.queue) this.queue.push(a); else { this.current = a; this.queue = []; }
    if (Settings.voice && opts.voice !== false) this.speak(opts.speak || text);
  },
  speak(text) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[—!]/g, m => m === '—' ? ',' : '!'));
      u.rate = 1.05; u.pitch = 0.55; u.volume = Math.min(1, Settings.sfx + 0.2);
      const v = speechSynthesis.getVoices().find(v => /en/i.test(v.lang) && /male|david|daniel|alex|fred|google uk english male/i.test(v.name));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* speech unavailable */ }
  },
  update() {
    if (this.current) { this.current.t++; if (this.current.t > this.current.dur) this.current = this.queue.shift() || null; }
    else if (this.queue.length) this.current = this.queue.shift();
  },
  draw(c) {
    const a = this.current; if (!a) return;
    const p = a.t / a.dur;
    const sIn = Math.min(1, a.t / 10);
    const scale = a.t < 10 ? easeOutBack(sIn) * 1.0 : 1 + Math.max(0, p - 0.85) * 0.6;
    const alpha = p > 0.85 ? 1 - (p - 0.85) / 0.15 : 1;
    c.save(); c.globalAlpha = Math.max(0, alpha);
    c.translate(W / 2, a.y); c.scale(scale, scale); c.rotate(-0.03);
    bigText(c, a.text, 0, 0, a.size, a.color, '#0b1530');
    if (a.sub) bigText(c, a.sub, 0, a.size * 0.75, a.size * 0.38, '#fff', '#0b1530');
    c.restore();
  },
  clear() { this.current = null; this.queue = []; try { speechSynthesis.cancel(); } catch (e) {} }
};

'use strict';
// ============================================================
// Character art: procedural cartoon fighters (skeletal poses + cel-shaded parts)
// ============================================================
const INK = '#14182b';

// ---------------- Poses ----------------
// Angles in radians. Legs: 0 = straight down, + = forward. Knee flex rotates shin backward.
// Arms: 0 = hanging, + = forward/up. Elbow flex rotates forearm forward/up.
const POSE_KEYS = ['lean', 'hx', 'bT', 'bK', 'fT', 'fK', 'bA', 'bE', 'fA', 'fE', 'head', 'rot', 'dy'];
const P = (o) => Object.assign({ lean: 0, hx: 0, bT: 0, bK: 0, fT: 0, fK: 0, bA: 0, bE: 0, fA: 0, fE: 0, head: 0, rot: 0, dy: 0 }, o);
const POSES = {
  idle:    P({ lean: .06, fT: .38, fK: .32, bT: -.32, bK: .22, fA: .55, fE: 2.05, bA: .35, bE: 2.15 }),
  walk:    P({ lean: .1, fA: .6, fE: 2.0, bA: .4, bE: 2.1 }),
  jump:    P({ lean: .05, fT: 1.1, fK: 1.7, bT: .25, bK: 1.5, fA: .9, fE: 1.6, bA: .4, bE: 1.4 }),
  block:   P({ lean: -.1, fT: .3, fK: .45, bT: -.35, bK: .35, fA: 1.15, fE: 2.25, bA: 1.0, bE: 2.35, head: .15 }),
  lp:      P({ lean: .14, fT: .45, fK: .3, bT: -.38, bK: .15, fA: 1.55, fE: .05, bA: .45, bE: 2.2 }),
  hp:      P({ lean: .3, hx: 8, fT: .55, fK: .35, bT: -.45, bK: .1, fA: .4, fE: 2.4, bA: 1.62, bE: .02, head: .05 }),
  lk:      P({ lean: -.12, fT: 1.45, fK: .15, bT: -.12, bK: .12, fA: .7, fE: 1.9, bA: .2, bE: 1.9 }),
  hk:      P({ lean: -.45, fT: 2.05, fK: .2, bT: -.25, bK: .05, fA: .3, fE: 2.2, bA: -.6, bE: 1.2 }),
  jlp:     P({ lean: .2, fT: .9, fK: 1.6, bT: .2, bK: 1.4, fA: 1.35, fE: .15, bA: .3, bE: 2.0 }),
  jhp:     P({ lean: .35, fT: .8, fK: 1.4, bT: .1, bK: 1.3, fA: .3, fE: 2.2, bA: 1.0, bE: .1 }),

// ---------------- Skeleton ----------------
function skeleton(L, p) {
  const leg = (hip, a1, a2) => {
    const k = { x: hip.x + Math.sin(a1) * L.thigh, y: hip.y + Math.cos(a1) * L.thigh };
    const a = a1 - a2;
    return { hip, knee: k, foot: { x: k.x + Math.sin(a) * L.shin, y: k.y + Math.cos(a) * L.shin }, a };
  };
  // compute legs relative to hip (0,0) first for grounding
  let fl = leg({ x: 0, y: 0 }, p.fT, p.fK), bl = leg({ x: 0, y: 0 }, p.bT, p.bK);
  return { fl, bl };
}

function limb(c, pts, w, color, outline = true) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (outline) {
    c.strokeStyle = INK; c.lineWidth = w + 5;
    c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.stroke();
  }
  c.strokeStyle = color; c.lineWidth = w;
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.stroke();
}
function seg(c, a, b, w, color) { limb(c, [a, b], w, color); }
function dot(c, x, y, r, fill, stroke = INK, lw = 2.5) {
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
}
function ell(c, x, y, rx, ry, fill, stroke = INK, lw = 2.5, rot = 0) {
  c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
}

// ImmunoCare-style shield badge
function drawLogo(c, x, y, s = 1) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.beginPath(); c.moveTo(0, -7); c.lineTo(6, -5); c.lineTo(5.5, 2); c.quadraticCurveTo(3, 6, 0, 8); c.quadraticCurveTo(-3, 6, -5.5, 2); c.lineTo(-6, -5); c.closePath();
  c.fillStyle = '#1f5fd1'; c.fill(); c.strokeStyle = '#cfe2ff'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#9fd0ff'; c.beginPath(); c.arc(0, 0, 2.2, 0, TAU); c.fill();
  c.restore();
}

// ---------------- Head ----------------
function drawHead(c, L, expr, t, blink) {
  const rx = L.headRx, ry = L.headRy, cx = 2, cy = -ry + 1;
  // neck
  c.fillStyle = L.skinD; c.strokeStyle = INK; c.lineWidth = 2.5;
  rr(c, -9, -14, 20, 22, 6); c.fill(); c.stroke();

  // ponytail behind
  if (L.hairStyle === 'pony') {
    const sw = Math.sin(t * 0.12) * 0.25;
    c.save(); c.translate(-rx + 6, cy - 12); c.rotate(0.5 + sw);
    ell(c, -6, 18, 10, 24, L.hair); c.restore();
    ell(c, -rx + 6, cy - 12, 6, 6, '#e94f7a');
  }
  // ear
  ell(c, -7, cy + 3, 6.5, 9, L.skin);
  ell(c, -7, cy + 3, 3, 5, L.skinD, null);

  // head shape
  c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU);
  c.fillStyle = L.skin; c.fill();
  // back shading
  c.save(); c.clip();
  c.fillStyle = L.skinD; c.globalAlpha = 0.55;
  c.beginPath(); c.ellipse(cx - rx * 0.95, cy + 2, rx * 0.55, ry * 1.1, 0, 0, TAU); c.fill();
  c.globalAlpha = 1; c.restore();
  c.strokeStyle = INK; c.lineWidth = 2.8; c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.stroke();
  // re-draw ear on top of outline at the back
  ell(c, -7, cy + 3, 6.5, 9, L.skin); ell(c, -7, cy + 4, 2.8, 4.5, L.skinD, null);

  // nose (protrudes on the facing side)
  c.beginPath();
  c.moveTo(cx + rx - 4, cy - 6);
  c.quadraticCurveTo(cx + rx + 7, cy + 6, cx + rx + 1, cy + 9);
  c.quadraticCurveTo(cx + rx - 4, cy + 11, cx + rx - 7, cy + 8);
  c.fillStyle = L.skin; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.2; c.stroke();
  ell(c, cx + rx - 3, cy + 8, 2.4, 1.4, L.skinD, null);

  // hair
  drawHair(c, L, cx, cy, rx, ry, t);

  // beard
  if (L.beard) drawBeard(c, L, cx, cy, rx, ry);

  // eyes
  const ey = cy - 3;
  const eyes = [{ x: cx + 5, s: 1 }, { x: cx + 17, s: 0.85 }];
  for (const e of eyes) {
    if (expr === 'ko') {
      c.strokeStyle = INK; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(e.x - 4, ey - 4); c.lineTo(e.x + 4, ey + 4); c.moveTo(e.x + 4, ey - 4); c.lineTo(e.x - 4, ey + 4); c.stroke();
    } else if (expr === 'hurt' || blink) {
      c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath();
      if (expr === 'hurt') { c.moveTo(e.x - 4, ey - 3); c.lineTo(e.x + 3, ey); c.lineTo(e.x - 4, ey + 3); }
      else { c.moveTo(e.x - 4, ey); c.quadraticCurveTo(e.x, ey + 2.5, e.x + 4, ey); }
      c.stroke();
    } else if (expr === 'happy') {
      c.strokeStyle = INK; c.lineWidth = 2.8; c.beginPath(); c.moveTo(e.x - 4, ey + 1); c.quadraticCurveTo(e.x, ey - 4, e.x + 4, ey + 1); c.stroke();
    } else {
      const big = expr === 'shock' ? 1.4 : 1;
      ell(c, e.x, ey, 4.6 * e.s * big, 3.8 * big, '#fff', INK, 1.6);
      dot(c, e.x + 1.3, ey + 0.3, 2.6 * e.s, L.eye, null);
      dot(c, e.x + 2.1, ey - 0.9, 0.9, '#fff', null);
      if (L.lashes) { c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.moveTo(e.x - 5, ey - 2); c.quadraticCurveTo(e.x, ey - 6, e.x + 5, ey - 3); c.stroke(); }
    }
  }
  // brows
  const angry = expr === 'fierce' || expr === 'shout';
  const sad = expr === 'hurt' || expr === 'ko';
  c.strokeStyle = L.hair && L.hairStyle !== 'parted' ? L.hair : (L.beard || '#4a3a30');
  if (L.hairStyle === 'parted') c.strokeStyle = '#8d8f99';
  if (L.hairStyle === 'pony') c.strokeStyle = '#4a2814';
  c.lineWidth = L.beard ? 4.2 : 3; c.lineCap = 'round';
  for (const e of eyes) {
    c.beginPath();
    const inner = angry ? 3.5 : sad ? -3 : 0;
    c.moveTo(e.x - 5, ey - 8 - (sad ? 2 : 0)); c.lineTo(e.x + 5, ey - 8 + (e.x > cx + 10 ? -inner : inner) * 0.6 - (e.x < cx + 10 ? inner * 0.4 : 0));
    c.stroke();
  }

  // glasses
  if (L.glasses) {
    c.strokeStyle = '#1a1a1a'; c.lineWidth = 2;
    for (const e of eyes) { rr(c, e.x - 6, ey - 5, 12, 10, 3); c.stroke(); }
    c.beginPath(); c.moveTo(eyes[0].x + 6, ey - 1); c.lineTo(eyes[1].x - 6, ey - 1); c.moveTo(eyes[0].x - 6, ey - 1); c.lineTo(-4, ey - 2); c.stroke();
    c.fillStyle = 'rgba(180,220,255,.25)'; for (const e of eyes) { rr(c, e.x - 6, ey - 5, 12, 10, 3); c.fill(); }
  }

  // mouth
  const mx = cx + 13, my = cy + 15;
  c.lineWidth = 2.4; c.strokeStyle = INK;
  if (expr === 'shout' || expr === 'shock') {
    ell(c, mx, my + 1, 6, expr === 'shock' ? 6 : 7.5, '#4a0d14');
    ell(c, mx, my + 5, 3.5, 2.5, '#d4526a', null);
    c.fillStyle = '#fff'; c.fillRect(mx - 4.5, my - 5.5, 9, 2.5);
  } else if (expr === 'hurt') {
    rr(c, mx - 7, my - 3, 14, 7, 3); c.fillStyle = '#fff'; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(mx - 7, my + 0.5); c.lineTo(mx + 7, my + 0.5); c.stroke();
  } else if (expr === 'ko') {
    c.beginPath(); c.moveTo(mx - 6, my + 2); c.quadraticCurveTo(mx, my - 3, mx + 6, my + 2); c.stroke();
    ell(c, mx + 4, my + 5, 2.5, 3.5, '#e86f8a', null);
  } else if (L.smile === 'grin' || expr === 'happy' || expr === 'fierce') {
    c.beginPath(); c.moveTo(mx - 9, my - 3); c.quadraticCurveTo(mx, my + 10, mx + 9, my - 4); c.quadraticCurveTo(mx, my - 1, mx - 9, my - 3);
    c.fillStyle = '#fff'; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(mx - 7, my - 1); c.quadraticCurveTo(mx, my + 2, mx + 7, my - 1.5); c.strokeStyle = '#c9c9c9'; c.lineWidth = 1; c.stroke();
  } else if (L.smile === 'smug') {
    c.beginPath(); c.moveTo(mx - 6, my + 1); c.quadraticCurveTo(mx + 2, my + 3, mx + 8, my - 3); c.stroke();
  } else {
    c.beginPath(); c.moveTo(mx - 7, my - 1); c.quadraticCurveTo(mx, my + 5, mx + 7, my - 2); c.stroke();
  }
  if (L.lips && expr !== 'shout' && expr !== 'shock') { c.strokeStyle = L.lips; c.lineWidth = 3; c.beginPath(); c.moveTo(mx - 5, my); c.quadraticCurveTo(mx, my + 3.5, mx + 5, my - 0.5); c.stroke(); }
  // cheek blush / sweat
  if (expr === 'hurt' || expr === 'shock') {
    c.fillStyle = '#8fd3ff'; c.strokeStyle = INK; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(cx - 12, cy - 22); c.quadraticCurveTo(cx - 18, cy - 12, cx - 12, cy - 10); c.quadraticCurveTo(cx - 6, cy - 12, cx - 12, cy - 22); c.fill(); c.stroke();
  }
}

function drawHair(c, L, cx, cy, rx, ry, t) {
  const top = cy - ry;
  c.lineWidth = 2.6; c.strokeStyle = INK;
  if (L.hairStyle === 'bald') {
    c.fillStyle = 'rgba(255,255,255,.28)';
    c.beginPath(); c.ellipse(cx + 3, top + 8, 10, 4, -0.15, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(cx + 11, top + 13, 4, 2, -0.3, 0, TAU); c.fill();
    return;
  }
  if (L.hairStyle === 'slick') {
    // faded sides
    c.save(); c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.clip();
    const g = c.createLinearGradient(0, top, 0, cy + 4);
    g.addColorStop(0, 'rgba(20,16,18,.85)'); g.addColorStop(1, 'rgba(20,16,18,0)');
    c.fillStyle = g; c.fillRect(cx - rx, top, rx * 1.2, ry + 6);
    c.restore();
    // voluminous slicked-back top
    c.beginPath();
    c.moveTo(cx - rx + 1, cy - 6);
    c.quadraticCurveTo(cx - rx - 2, top - 2, cx - 4, top - 9);
    c.quadraticCurveTo(cx + 12, top - 15, cx + rx - 1, top - 4);
    c.quadraticCurveTo(cx + rx + 3, top + 6, cx + rx - 5, top + 12);
    c.quadraticCurveTo(cx + 8, top + 6, cx - 6, top + 12);
    c.quadraticCurveTo(cx - 14, top + 14, cx - rx + 4, cy - 2);
    c.closePath(); c.fillStyle = L.hair; c.fill(); c.stroke();
    // shine streaks
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1.6;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(cx + 14 - i * 9, top - 6 + i * 1.5); c.quadraticCurveTo(cx - i * 9, top - 6, cx - 14 - i * 6, top + 3 + i * 2); c.stroke(); }
    return;
  }
  if (L.hairStyle === 'crop') {
    // high fade sides
    c.save(); c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.clip();
    const g = c.createLinearGradient(0, top + 8, 0, cy + 2);
    g.addColorStop(0, 'rgba(18,16,17,.9)'); g.addColorStop(1, 'rgba(18,16,17,0)');
    c.fillStyle = g; c.fillRect(cx - rx, top, rx * 1.25, ry + 4);
    c.restore();
    // textured crop top with blunt fringe
    const fy = cy - 13; // fringe line
    c.beginPath();
    c.moveTo(cx - rx + 2, cy - 4);
    c.quadraticCurveTo(cx - rx - 2, top + 2, cx - 10, top - 3);
    // spiky texture along top
    const n = 9;
    for (let i = 0; i <= n; i++) {
      const xx = lerp(cx - 10, cx + rx - 1, i / n);
      const yy = top - 4 + Math.pow(i / n, 2) * 10 + (i % 2 ? -5 : 0);
      c.lineTo(xx, yy);
    }
    c.lineTo(cx + rx + 1, fy - 2);
    c.lineTo(cx + rx - 2, fy);     // blunt straight fringe
    c.lineTo(cx + 2, fy + 1);
    c.lineTo(cx - 8, fy - 1);
    c.quadraticCurveTo(cx - 16, fy, cx - rx + 5, cy - 2);
    c.closePath(); c.fillStyle = L.hair; c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.3;
    for (let i = 0; i < 6; i++) { const xx = cx - 6 + i * 5; c.beginPath(); c.moveTo(xx, top + 2 + i); c.lineTo(xx + 3, fy - 4); c.stroke(); }
    return;
  }
  if (L.hairStyle === 'pony') {
    c.beginPath();
    c.moveTo(cx - rx + 1, cy + 4);
    c.quadraticCurveTo(cx - rx - 3, top - 2, cx + 2, top - 3);
    c.quadraticCurveTo(cx + rx + 2, top, cx + rx, cy - 10);
    c.quadraticCurveTo(cx + 12, top + 6, cx - 2, top + 13);
    c.quadraticCurveTo(cx - 12, top + 18, cx - 13, cy + 2);
    c.closePath(); c.fillStyle = L.hair; c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(cx + 12, top + 1); c.quadraticCurveTo(cx - 5, top + 2, cx - 15, top + 14); c.stroke();
    return;
  }
  if (L.hairStyle === 'parted') {
    c.beginPath();
    c.moveTo(cx - rx + 1, cy + 2);
    c.quadraticCurveTo(cx - rx - 3, top - 1, cx + 2, top - 4);
    c.quadraticCurveTo(cx + rx + 2, top - 1, cx + rx - 1, cy - 12);
    c.quadraticCurveTo(cx + 14, top + 4, cx + 4, top + 7);
    c.lineTo(cx - 4, top + 5);
    c.quadraticCurveTo(cx - 12, top + 14, cx - 13, cy + 2);
    c.closePath(); c.fillStyle = L.hair; c.fill(); c.stroke();
    c.strokeStyle = '#8a8c96'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(cx - 4, top + 5); c.quadraticCurveTo(cx - 8, top - 1, cx - 15, top + 2); c.stroke();
  }
}

function drawBeard(c, L, cx, cy, rx, ry) {
  const dense = L.beardStyle === 'dense', trim = L.beardStyle === 'trim';
  const chinY = cy + ry + (dense ? 5 : trim ? 1 : 2);
  c.beginPath();
  // sideburn from in front of ear down the jaw to the chin and up to the mouth area
  c.moveTo(cx - 6, cy - (dense ? 6 : 2));
  c.lineTo(cx - 1, cy - (dense ? 6 : 2));
  c.quadraticCurveTo(cx + 2, cy + 6, cx + 9, cy + 7);         // cheek line
  c.quadraticCurveTo(cx + 15, cy + 5, cx + rx - 1, cy + 9);   // over upper lip (mustache top)
  c.quadraticCurveTo(cx + rx + 3, cy + 18, cx + rx - 3, cy + 23);
  c.quadraticCurveTo(cx + 14, chinY + 2, cx + 6, chinY);
  c.quadraticCurveTo(cx - 6, chinY - 3, cx - 10, cy + 8);
  c.closePath();
  c.fillStyle = L.beard; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
  // fuzzy texture
  c.fillStyle = 'rgba(255,255,255,.08)';

}

// ---------------- Torso / outfits ----------------
function drawTorso(c, L, t) {
  const T = L.torso, sh = L.shoulder, wa = L.waist;
  // body shape in torso space: hip at (0,0), neck at (0,-T)
  const body = () => {
    c.beginPath();
    c.moveTo(-wa, 0);
    c.quadraticCurveTo(-wa - 6, -T * 0.5, -sh, -T + 14);
    c.quadraticCurveTo(-sh + 4, -T - 2, -8, -T - 2);
    c.lineTo(10, -T - 2);
    c.quadraticCurveTo(sh - 2, -T - 2, sh + 2, -T + 14);
    c.quadraticCurveTo(wa + 8 + (L.outfit === 'suit' ? 8 : 0), -T * 0.42, wa, 0);
    c.closePath();
  };
  body(); c.fillStyle = L.top; c.fill();
  c.save(); body(); c.clip();
  // shading on the back half
  c.fillStyle = L.topD; c.globalAlpha = 0.7; c.fillRect(-sh - 10, -T - 5, sh * 0.7, T + 10); c.globalAlpha = 1;

  if (L.outfit === 'coat') {
    // white V-neck shirt under coat
    c.fillStyle = L.under; c.beginPath(); c.moveTo(-10, -T - 2); c.lineTo(18, -T - 2); c.lineTo(12, -T * 0.25); c.lineTo(-4, -T * 0.25); c.closePath(); c.fill();
    c.strokeStyle = '#c9d0da'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-6, -T - 2); c.lineTo(4, -T + 18); c.lineTo(14, -T - 2); c.stroke();
    // lapels
    c.fillStyle = '#e6ebf1'; c.strokeStyle = INK; c.lineWidth = 2;
    c.beginPath(); c.moveTo(14, -T - 1); c.lineTo(26, -T + 30); c.lineTo(15, -T + 34); c.lineTo(14, -T * 0.25); c.lineTo(10, -T * 0.25); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-10, -T - 1); c.lineTo(-18, -T + 28); c.lineTo(-8, -T + 32); c.lineTo(-4, -T * 0.25); c.closePath(); c.fill(); c.stroke();
    // pocket + logo
    c.strokeStyle = '#9aa6b5'; c.lineWidth = 1.5; rr(c, 18, -T + 44, 16, 14, 2); c.stroke();
    drawLogo(c, 26, -T + 36, 1.1);
    c.fillStyle = '#1d2a56'; c.font = 'bold 5px sans-serif'; c.textAlign = 'center'; c.fillText('ImmunoCare', 26, -T + 52);
    // stethoscope
    c.strokeStyle = '#2b2f36'; c.lineWidth = 3.5; c.beginPath();
    c.moveTo(-14, -T + 2); c.quadraticCurveTo(-22, -T + 34, -6, -T + 52); c.quadraticCurveTo(4, -T + 60, 8, -T + 46);
    c.moveTo(18, -T + 2); c.quadraticCurveTo(26, -T + 26, 22, -T + 40);
    c.stroke();
    dot(c, 22, -T + 44, 5, '#cfd6de', INK, 2); dot(c, 22, -T + 44, 2.2, '#8f9aa6', null);
  } else if (L.outfit === 'scrubs') {
    if (L.under) {
      c.fillStyle = L.under; c.beginPath(); c.moveTo(-12, -T - 2); c.lineTo(20, -T - 2); c.lineTo(5, -T + 22); c.closePath(); c.fill();
    } else {
      c.fillStyle = L.skin; c.beginPath(); c.moveTo(-8, -T - 2); c.lineTo(16, -T - 2); c.lineTo(5, -T + 18); c.closePath(); c.fill();
    }
    c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.moveTo(-12, -T - 2); c.lineTo(5, -T + 22); c.lineTo(20, -T - 2); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.6; rr(c, 14, -T + 36, 18, 16, 2); c.stroke();
    if (L === LOOKS.ruben) { drawLogo(c, 22, -T + 28, 1.15); c.fillStyle = '#fff'; c.font = 'bold 5px sans-serif'; c.textAlign = 'center'; c.fillText('ImmunoCare', 22, -T + 40); }
    else { // badge reel
      c.strokeStyle = '#ffd23f'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(16, -T + 30); c.lineTo(16, -T + 40); c.stroke();
      rr(c, 10, -T + 40, 13, 17, 2); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.2; c.stroke();
      c.fillStyle = '#e94f7a'; c.fillRect(11, -T + 41, 11, 4);
      c.fillStyle = '#e94f7a'; c.font = 'bold 6px sans-serif'; c.textAlign = 'center'; c.fillText('RN', 16.5, -T + 54);
    }
  } else if (L.outfit === 'polo') {
    // collar + placket
    c.fillStyle = L.top; c.strokeStyle = INK; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-12, -T - 3); c.lineTo(-4, -T + 12); c.lineTo(4, -T + 1); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(20, -T - 3); c.lineTo(14, -T + 12); c.lineTo(5, -T + 1); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1.5; rr(c, 1, -T + 2, 8, 30, 2); c.stroke();
    dot(c, 5, -T + 12, 1.6, '#e8e8e8', null); dot(c, 5, -T + 22, 1.6, '#e8e8e8', null);
    // phlebotomy badge
    rr(c, 16, -T + 34, 16, 20, 2); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#c4161c'; c.beginPath(); c.moveTo(24, -T + 37); c.quadraticCurveTo(29, -T + 44, 24, -T + 47); c.quadraticCurveTo(19, -T + 44, 24, -T + 37); c.fill();
    c.fillStyle = '#1e2d66'; c.font = 'bold 4.5px sans-serif'; c.textAlign = 'center'; c.fillText('LAB', 24, -T + 52);
    // tourniquet draped over shoulder

  } else if (L.outfit === 'suit') {
    c.fillStyle = L.under; c.beginPath(); c.moveTo(-10, -T - 2); c.lineTo(18, -T - 2); c.lineTo(8, -T * 0.35); c.lineTo(2, -T * 0.35); c.closePath(); c.fill();
    // tie
    c.fillStyle = '#c0262d'; c.strokeStyle = INK; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(2, -T); c.lineTo(8, -T); c.lineTo(7, -T + 6); c.lineTo(10, -T * 0.42); c.lineTo(5, -T * 0.35); c.lineTo(0, -T * 0.42); c.lineTo(3, -T + 6); c.closePath(); c.fill(); c.stroke();
    // lapels
    c.fillStyle = L.topD; c.lineWidth = 2;
    c.beginPath(); c.moveTo(16, -T - 1); c.lineTo(28, -T + 24); c.lineTo(18, -T + 28); c.lineTo(10, -T * 0.35); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-10, -T - 1); c.lineTo(-20, -T + 24); c.lineTo(-10, -T + 28); c.lineTo(0, -T * 0.35); c.closePath(); c.fill(); c.stroke();
    // pocket square + lanyard
    c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(22, -T + 40); c.lineTo(32, -T + 40); c.lineTo(27, -T + 34); c.closePath(); c.fill();
    dot(c, 4, -T * 0.25, 1.8, '#111', null); dot(c, 4, -T * 0.12, 1.8, '#111', null);
  }
  c.restore();
  body(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  // belt line
  if (L.outfit === 'scrubs' || L.outfit === 'polo') { c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-wa + 2, -6); c.lineTo(wa - 1, -6); c.stroke(); }
}

// Coat tails / jacket flaps drawn over the legs
function drawTails(c, L, lean, fT, bT) {
  if (L.outfit !== 'coat' && L.outfit !== 'suit') return;
  const len = L.outfit === 'coat' ? 58 : 22;
  const swing = clamp((fT - bT) * 0.12, -0.3, 0.3);
  c.save(); c.rotate(-lean * 0.5);
  c.beginPath();
  c.moveTo(-L.waist - 1, -4);
  c.lineTo(-L.waist - 8 + swing * 30, len);
  c.lineTo(-2, len + 4);
  c.lineTo(4, -2);
  c.closePath(); c.fillStyle = L.topD; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
  c.beginPath();
  c.moveTo(2, -4);
  c.lineTo(6 + swing * 40, len + 2);
  c.lineTo(L.waist + 8 + swing * 40, len - 2);
  c.lineTo(L.waist + 1, -4);
  c.closePath(); c.fillStyle = L.top; c.fill(); c.stroke();
  c.restore();
}

// ---------------- Full fighter ----------------
// opts: { pose, facing, expr, t, blink, prop, alpha, tint, scale }
function drawCharacter(c, L, x, y, o) {
  const p = o.pose;
  c.save();
  c.translate(x, y);
  const s = o.scale || 1;
  c.scale((o.facing || 1) * s, s);
  if (o.alpha != null) c.globalAlpha = o.alpha;
  if (p.rot) { c.translate(0, p.dy); c.rotate(p.rot); }

  const { fl, bl } = skeleton(L, p);
  // ground the lowest point (feet or knees)
  let low = Math.max(fl.foot.y, bl.foot.y, fl.knee.y - 4, bl.knee.y - 4);
  if (o.air) low = L.thigh + L.shin - 12;
  const hip = { x: p.hx, y: -low - 6 };
  const off = (pt) => ({ x: pt.x + hip.x, y: pt.y + hip.y });
  const T = L.torso;
  const neck = { x: hip.x + Math.sin(p.lean) * T, y: hip.y - Math.cos(p.lean) * T };
  const shoulderOf = (side) => {
    const sx = side > 0 ? 8 : -12;
    return { x: neck.x + Math.cos(p.lean) * sx + Math.sin(p.lean) * 12, y: neck.y + 12 + Math.sin(p.lean) * -sx };
  };
  const arm = (sh, a1, a2) => {
    const e = { x: sh.x + Math.sin(a1) * L.uArm, y: sh.y + Math.cos(a1) * L.uArm };
    const a = a1 + a2;
    return { sh, el: e, hand: { x: e.x + Math.sin(a) * L.fArm, y: e.y + Math.cos(a) * L.fArm }, a };
  };
  const fa = arm(shoulderOf(1), p.fA, p.fE), ba = arm(shoulderOf(-1), p.bA, p.bE);
  const LW = L.limbW;
  const sleeveCol = (front) => front ? L.top : L.topD;
  const drawArm = (A, front) => {
    const handCol = L.glove || L.skin;
    if (L.sleeve === 'long') {
      limb(c, [A.sh, A.el, A.hand], LW - 3, sleeveCol(front));
      if (L.outfit === 'suit') { const cuff = { x: lerp(A.el.x, A.hand.x, .82), y: lerp(A.el.y, A.hand.y, .82) }; seg(c, cuff, A.hand, LW - 8, L.under); }
    } else {
      limb(c, [A.sh, A.el, A.hand], LW - 7, front ? L.skin : L.skinD);
      const mid = { x: lerp(A.sh.x, A.el.x, .55), y: lerp(A.sh.y, A.el.y, .55) };
      limb(c, [A.sh, mid], LW - 1, sleeveCol(front));
    }
    // fist
    dot(c, A.hand.x, A.hand.y, 9.5, front ? handCol : shade(handCol), INK, 2.5);
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(A.hand.x - 3, A.hand.y - 6); c.lineTo(A.hand.x - 3, A.hand.y + 4); c.stroke();
  };
  const drawLeg = (lg, front) => {
    const h = off(lg.hip), k = off(lg.knee), f = off(lg.foot);
    limb(c, [h, k, f], LW + 2, front ? L.pants : L.pantsD);
    // shoe
    c.save(); c.translate(f.x, f.y); c.rotate(-(lg.a) * 0.6);
    ell(c, 9, 2, 17, 7.5, front ? L.shoe : shade(L.shoe));
    c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(-2, 4, 22, 2);
    c.restore();
  };

  drawArm(ba, false);
  drawLeg(bl, false);
  drawLeg(fl, true);
  // torso
  c.save(); c.translate(hip.x, hip.y); c.rotate(p.lean);
  drawTorso(c, L, o.t || 0);
  c.restore();
  c.save(); c.translate(hip.x, hip.y); drawTails(c, L, p.lean, p.fT, p.bT); c.restore();
  // head
  c.save(); c.translate(neck.x, neck.y + 4); c.rotate(p.lean * 0.6 + p.head); c.scale(1.13, 1.13);
  drawHead(c, L, o.expr || 'normal', o.t || 0, o.blink);
  c.restore();
  drawArm(fa, true);
  if (o.prop) drawProp(c, o.prop, fa.hand, fa.a, o.t || 0);
  c.restore();
  return { hand: fa.hand, neck, hip };
}

function shade(hex, k = 0.78) {
  if (!hex || hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.floor(((n >> 16) & 255) * k), g = Math.floor(((n >> 8) & 255) * k), b = Math.floor((n & 255) * k);
  return `rgb(${r},${g},${b})`;
}

// Props held in the front hand
function drawProp(c, prop, h, a, t) {
  c.save(); c.translate(h.x, h.y);
  if (prop === 'tablet') {
    c.rotate(-0.2);
    c.shadowColor = '#5ff'; c.shadowBlur = 30;
    rr(c, -16, -46, 34, 46, 5); c.fillStyle = '#1b2233'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
    rr(c, -12, -42, 26, 36, 3); c.fillStyle = '#7ff5ff'; c.fill();
    c.shadowBlur = 0; c.fillStyle = '#c4161c'; c.font = 'bold 8px sans-serif'; c.textAlign = 'center'; c.fillText('DENIED', 1, -22);
  } else if (prop === 'ivpole') {
    c.rotate(t * 0.6);
    c.strokeStyle = '#b8c2cc'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -110); c.lineTo(0, 110); c.stroke();
    c.lineWidth = 3; c.beginPath(); c.moveTo(-16, -105); c.lineTo(16, -105); c.stroke();
    rr(c, -10, -100, 20, 28, 6); c.fillStyle = 'rgba(170,230,255,.85)'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.font = 'bold 7px sans-serif'; c.textAlign = 'center'; c.fillText('NS', 0, -84);
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(0, 110); c.lineTo(22 * s, 120); c.strokeStyle = '#8c96a0'; c.lineWidth = 4; c.stroke(); dot(c, 22 * s, 122, 4, '#333', null); }
  } else if (prop === 'clipboard') {
    c.rotate(-0.3);
    rr(c, -14, -40, 30, 40, 3); c.fillStyle = '#b07a3e'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-10, -34, 22, 30); c.fillStyle = '#999'; c.fillRect(-4, -43, 10, 6);
    c.fillStyle = '#2a7'; for (let i = 0; i < 4; i++) c.fillRect(-7, -30 + i * 7, 14, 2);
  } else if (prop === 'needle') {
    c.rotate(a - Math.PI / 2);
    c.fillStyle = '#ffd23f'; c.beginPath(); c.ellipse(0, 0, 10, 5, 0, 0, TAU); c.fill();
    c.strokeStyle = '#ccc'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, 0); c.lineTo(28, 0); c.stroke();
  }
  c.restore();
}

// Bust portrait (select screen / HUD)
function drawBust(c, L, x, y, size, expr = 'normal', t = 0, facing = 1) {
  c.save(); c.translate(x, y); c.scale(size * facing, size);
  c.save(); c.translate(0, L.torso + 22); drawTorso(c, L, t); c.restore();
  c.save(); c.translate(0, 26); drawHead(c, L, expr, t, false); c.restore();
  c.restore();
}

// Optional: externally supplied portrait art (assets/portraits/<id>.png). Falls back to procedural busts.
const PortraitImages = {};
function loadPortraitImages(ids) {
  // Opt-in (add ?portraits=1 to the URL) so the self-contained build makes no failing requests.
  if (!/[?&]portraits=1/.test(location.search)) return;
  for (const id of ids) {
    const img = new Image();
    img.onload = () => { PortraitImages[id] = img; };
    img.onerror = () => {};
    img.src = `assets/portraits/${id}.png`;
  }
}

// ---------- Particles & floating text ----------
class Particle {
  constructor(x, y, o) {
    this.x = x; this.y = y; this.vx = o.vx ?? rand(-6, 6); this.vy = o.vy ?? rand(-8, -2);
    this.g = o.g ?? 0.35; this.life = this.max = o.life ?? 30; this.size = o.size ?? rand(3, 7);
    this.color = o.color || '#fff'; this.kind = o.kind || 'dot'; this.rot = rand(0, TAU); this.vr = rand(-0.3, 0.3);
    this.layer = o.layer || 'front'; this.item = o.item; this.drag = o.drag ?? 0.98;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += this.g; this.vx *= this.drag; this.rot += this.vr; return --this.life > 0; }
  draw(c) {
    const a = Math.min(1, this.life / (this.max * 0.4));
    c.save(); c.globalAlpha = a; c.translate(this.x, this.y); c.rotate(this.rot);
    if (this.kind === 'dot') { c.fillStyle = this.color; c.beginPath(); c.arc(0, 0, this.size, 0, TAU); c.fill(); }
    else if (this.kind === 'spark') { c.strokeStyle = this.color; c.lineWidth = 3; c.beginPath(); c.moveTo(-this.size * 2, 0); c.lineTo(this.size * 2, 0); c.stroke(); }
    else if (this.kind === 'confetti') { c.fillStyle = this.color; c.fillRect(-this.size, -this.size / 2, this.size * 2, this.size); }
    else if (this.kind === 'star') { star(c, 0, 0, this.size, this.color); }
    else if (this.kind === 'item') { ITEMS[this.item](c, this.size); }
    else if (this.kind === 'smoke') { c.fillStyle = this.color; c.globalAlpha = a * 0.5; c.beginPath(); c.arc(0, 0, this.size * (2 - a), 0, TAU); c.fill(); }
    c.restore();
  }
}
class FloatText {
  constructor(x, y, text, color = '#fff', size = 34, life = 50) { this.x = x; this.y = y; this.text = text; this.color = color; this.size = size; this.life = this.max = life; this.layer = 'front'; }
  update() { this.y -= 1.2; return --this.life > 0; }
  draw(c) {
    const t = 1 - this.life / this.max; const s = t < 0.15 ? easeOutBack(t / 0.15) : 1;
    c.save(); c.globalAlpha = Math.min(1, this.life / 15); c.translate(this.x, this.y); c.scale(s, s);
    bigText(c, this.text, 0, 0, this.size, this.color); c.restore();
  }
}

  constructor(x, y, text, color = '#ffd23f', size = 1) { this.x = x; this.y = y; this.text = text; this.color = color; this.s = size; this.life = 26; this.layer = 'front'; this.rot = rand(-0.3, 0.3); }

class Ring {

function sparks(g, x, y, color = '#fff', n = 12, kind = 'spark') {

}
function confetti(g, x, y, n = 60) {
  const cols = ['#ffd23f', '#ff5a8a', '#3bb3ff', '#7cf28b', '#ffffff', '#b07cff'];
  for (let i = 0; i < n; i++) g.fx.push(new Particle(x + rand(-200, 200), y + rand(-50, 50), { kind: 'confetti', color: pick(cols), vx: rand(-4, 4), vy: rand(-14, -4), g: 0.22, life: randi(70, 130), size: rand(4, 8), drag: 0.99 }));

// Generic projectile with a custom drawer. hit = hit definition passed to g.applyHit
class Projectile {
  constructor(g, owner, o) {
    this.g = g; this.owner = owner; this.x = o.x; this.y = o.y; this.vx = o.vx; this.vy = o.vy || 0; this.grav = o.grav || 0;
    this.w = o.w || 60; this.h = o.h || 50; this.hit = o.hit; this.drawFn = o.draw; this.life = o.life || 120; this.t = 0;
    this.wave = o.wave || 0; this.waveAmp = o.waveAmp || 0; this.baseY = o.y; this.spin = o.spin || 0; this.layer = 'front';
    this.isProjectile = true; this.noFlip = !!o.noFlip; this.dead = false; this.trail = o.trail || null; this.clash = o.clash !== false;
  }
  box() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
  update() {
    if (this.dead) return false;
    this.t++; this.x += this.vx; this.vy += this.grav; this.y += this.vy;
    if (this.wave) this.y = this.baseY + Math.sin(this.t * this.wave) * this.waveAmp;
    if (this.trail && this.t % 2 === 0) this.g.fx.push(new Particle(this.x - Math.sign(this.vx) * 20, this.y, { kind: 'dot', color: this.trail, vx: rand(-1, 1), vy: rand(-1, 1), g: 0, life: 16, size: rand(3, 6) }));
    const opp = this.g.other(this.owner);
    if (opp.hittable() && overlap(this.box(), opp.hurtbox())) {
      this.g.applyHit(this.owner, opp, this.hit, this.x);
      this.dead = true;
      sparks(this.g, this.x, this.y, '#ffd23f', 10);
      return false;
    }
    if (this.y > FLOOR + 10 || this.x < -200 || this.x > STAGE_W + 200) return false;
    return --this.life > 0;
  }
  draw(c) {
    c.save(); c.translate(this.x, this.y);
    if (this.vx < 0 && !this.noFlip) c.scale(-1, 1);
    if (this.spin) c.rotate(this.t * this.spin);
    this.drawFn(c, this.t);
    c.restore();
  }
}

// Timed effect: arbitrary update/draw with frame counter (summons, auras, traps)
class Timed {
  constructor(dur, o) { this.t = 0; this.dur = dur; this.u = o.update || (() => {}); this.d = o.draw || (() => {}); this.layer = o.layer || 'front'; this.data = o.data || {}; }
  update() { this.u(this.t, this); return ++this.t < this.dur && !this.kill; }
  draw(c) { this.d(c, this.t, this); }
}

function wrapText(c, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = ''; const lines = [];
  for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line);
  const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => c.fillText(l, x, y0 + i * lh));
  return lines.length;
}

// ---------- helpers used by specials ----------
function handPos(f, dy = -190) { return { x: f.x + f.facing * 70, y: f.y + dy }; }
function shoot(f, g, o) {
  const p = handPos(f, o.dy ?? -190);
  const pr = new Projectile(g, f, Object.assign({ x: p.x, y: p.y, vx: f.facing * (o.speed || 10) }, o));
  g.fx.push(pr); return pr;
}
function nearX(opp, x, r) { return Math.abs(opp.x - x) < r; }

// CPU AI
// ============================================================
const AI_LEVELS = [
  { react: 26, block: 0.12, aggro: 0.35, special: 0.010, combo: 0.15, antiProj: 0.15, dmg: 0.8 },
  { react: 16, block: 0.38, aggro: 0.55, special: 0.020, combo: 0.45, antiProj: 0.4, dmg: 1.0 },
  { react: 9, block: 0.62, aggro: 0.7, special: 0.032, combo: 0.7, antiProj: 0.65, dmg: 1.1 },
  { react: 4, block: 0.85, aggro: 0.85, special: 0.045, combo: 0.92, antiProj: 0.85, dmg: 1.25 }
];
class AI {
  constructor(f, level, mode = 'cpu') { this.f = f; this.L = AI_LEVELS[level]; this.mode = mode; this.wait = 0; this.hold = {}; this.holdT = 0; this.queue = []; this.lastOppState = ''; }
  think(g) {
    const f = this.f, o = g.other(f), L = this.L;
    const held = {}, pressed = {};
    const fwd = f.facing > 0 ? 'right' : 'left', back = f.facing > 0 ? 'left' : 'right';
    if (this.mode === 'stand') return { held, pressed };
    if (this.mode === 'block') { held.down = true; return { held, pressed }; }
    // continue holds
    if (this.holdT > 0) { this.holdT--; Object.assign(held, this.hold); }
    // combo queue executes on cancel windows
    if (this.queue.length) {
      if (f.state === 'attack' && f.atkHit && f.st >= f.atk.s + 1 || f.canAct()) {
        const nx = this.queue.shift();
        if (nx === 'sp') { pressed.sp = true; } else if (nx === 'ult') pressed.ult = true; else pressed[nx] = true;
        return { held, pressed };
      }
      if (f.state === 'attack' && !f.atkHit && f.st > f.atk.s + f.atk.a) this.queue = [];
      return { held, pressed };
    }
    const dist = Math.abs(o.x - f.x);
    // reactive defense (checked every frame but gated by reaction time)
    const threat = (o.state === 'attack' && dist < 240 && o.st < (o.atk ? o.atk.s + o.atk.a : 0)) ||
                   (o.state === 'cast' && dist < 200) ||
                   g.fx.some(p => p.isProjectile && p.owner === o && !p.dead && Math.abs(p.x - f.x) < 260 && Math.sign(p.vx) === Math.sign(f.x - p.x));
    if (threat && f.canAct()) {
      if (this.reactT == null) this.reactT = L.react;
      if (--this.reactT <= 0) {
        this.reactT = null;
        if (Math.random() < L.block) {
          if (Math.random() < L.antiProj * 0.3 && f.dodgeCd <= 0) { held.down = true; pressed[back] = true; }
          else { this.hold = { down: true }; this.holdT = 20; held.down = true; }
          return { held, pressed };
        }
      }
    } else this.reactT = null;

    if (--this.wait > 0) return { held, pressed };
    this.wait = Math.max(2, Math.round(L.react * rand(0.4, 1.0)));
    if (!f.canAct()) return { held, pressed };
    if (o.state === 'down' || o.state === 'getup') { if (dist < 140) { this.hold = { [back]: true }; this.holdT = 10; } return { held, pressed }; }

    // Ultimate
    if (f.energy >= 100 && Math.random() < L.aggro * 0.25 && dist < 700) { pressed.ult = true; return { held, pressed }; }
    // Specials
    const ready = f.def.specials.filter(s => !(f.cd[s.name] > 0) && s.input !== 'AIR');
    if (ready.length && Math.random() < L.special * this.wait) {
      const s = pick(ready);
      if (s.input === 'F') held[fwd] = true; if (s.input === 'B') held[back] = true; if (s.input === 'D') held.down = true;
      pressed.sp = true; return { held, pressed };
    }
    if (dist > 165) {
      const r = Math.random();
      if (r < L.aggro * 0.12 && dist < 450) { held.up = true; held[fwd] = true; this.queue = [pick(['hk', 'hp', 'lk'])]; this.qDelay = 12; return { held, pressed }; }
      if (r < L.aggro) { this.hold = { [fwd]: true }; this.holdT = randi(8, 22); held[fwd] = true; }
      else if (r < L.aggro + 0.12) { this.hold = { [back]: true }; this.holdT = randi(6, 14); }
      return { held, pressed };
    }
    // close range: attack strings
    const r = Math.random();
    if (r < L.aggro) {
      const strings = [['lp', 'lp', 'hp'], ['lk', 'hp'], ['lp', 'lk', 'hk'], ['hp', 'sp'], ['lp', 'hp', 'sp'], ['hk'], ['lk', 'lk', 'hp', 'sp']];
      let s = pick(strings);
      if (Math.random() > L.combo) s = [s[0]];
      if (s.includes('sp') && f.energy >= 100 && Math.random() < 0.5) s = s.map(x => x === 'sp' ? 'ult' : x);
      pressed[s[0]] = true; this.queue = s.slice(1);
      return { held, pressed };
    }
    if (r < L.aggro + 0.15) { this.hold = { down: true }; this.holdT = 18; held.down = true; }
    else { this.hold = { [back]: true }; this.holdT = 10; }
    return { held, pressed };
  }
}

function parallax(c, cam, p, fn) { c.save(); c.translate((cam.x - STAGE_W / 2) * (1 - p), 0); fn(); c.restore(); }
function gradRect(c, x, y, w, h, stops) {
  const g = c.createLinearGradient(0, y, 0, y + h); stops.forEach(([o, col]) => g.addColorStop(o, col)); c.fillStyle = g; c.fillRect(x, y, w, h);
}
function tileFloor(c, col1, col2, line = 'rgba(0,0,0,.12)') {
  gradRect(c, -400, FLOOR - 10, STAGE_W + 800, 200, [[0, col1], [1, col2]]);
  c.strokeStyle = line; c.lineWidth = 2;
  for (let i = -10; i < 40; i++) { c.beginPath(); c.moveTo(i * 80, FLOOR - 10); c.lineTo(i * 80 + (i * 80 - STAGE_W / 2) * 0.35, FLOOR + 190); c.stroke(); }
  for (let j = 0; j < 4; j++) { c.beginPath(); c.moveTo(-400, FLOOR + 10 + j * j * 14); c.lineTo(STAGE_W + 400, FLOOR + 10 + j * j * 14); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(-400, FLOOR - 10, STAGE_W + 800, 6);
}
// generic background staffer (faceless silhouette, cartoon)
function staffer(c, x, y, s, col, t, walking = true, skin = '#c99a74') {
  c.save(); c.translate(x, y); c.scale(s, s);
  const sw = walking ? Math.sin(t * 0.25) * 0.5 : 0;
  c.lineCap = 'round';
  c.strokeStyle = shade(col, 0.75); c.lineWidth = 16;
  c.beginPath(); c.moveTo(0, -95); c.lineTo(Math.sin(sw) * 40, -95 + Math.cos(sw) * 90); c.stroke();
  c.beginPath(); c.moveTo(0, -95); c.lineTo(-Math.sin(sw) * 40, -95 + Math.cos(sw) * 90); c.stroke();
  rr(c, -22, -190, 44, 100, 14); c.fillStyle = col; c.fill();
  c.strokeStyle = col; c.lineWidth = 12; c.beginPath(); c.moveTo(-14, -180); c.lineTo(-14 - Math.sin(sw) * 30, -110); c.stroke();
  dot(c, 0, -212, 20, skin, null);
  c.restore();
}
